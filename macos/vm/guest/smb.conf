[global]
  server role = standalone server
  map to guest = never
  # macOS interoperability: Finder metadata, resource forks, case handling
  vfs objects = catia fruit streams_xattr full_audit
  fruit:metadata = stream
  fruit:model = MacSamba
  fruit:posix_rename = yes
  fruit:veto_appledouble = no
  fruit:nfs_aces = no
  fruit:wipe_intentionally_left_blank_rfork = yes
  fruit:delete_empty_adfiles = yes
  server min protocol = SMB3
  # Private link between the Mac and its own VM: signing and encryption cost
  # throughput for nothing
  server signing = disabled
  smb encrypt = off
  # Asynchronous I/O lets the Mac keep several reads in flight while JuiceFS
  # fetches blocks
  aio read size = 1
  aio write size = 1
  use sendfile = yes
  # With a directory lease the macOS client keeps every folder it listed open
  # for as long as it likes: a team disk it ever browsed could never be
  # unmounted gently (to apply lowered access). Files keep their leases.
  smb3 directory leases = no
  # Colleagues' changes reach the open Finder windows through floppy-notify, a
  # trigger sent from this machine: with inotify on, notifyd drops it as
  # already covered. Changes made in the VM outside Samba send their own.
  kernel change notify = no
  log level = 1 full_audit:1@/var/log/samba/audit.log
  # The disk's activity (floppy-activity, DECISIONS #27): what this Mac creates,
  # writes, renames and deletes, in a log of its own, one line each with its
  # time. Reads are not recorded.
  full_audit:prefix = %S
  full_audit:success = mkdirat renameat unlinkat create_file
  full_audit:failure = none
  full_audit:syslog = false
  debug prefix timestamp = yes

[Floppy]
  path = /mnt/drive
  valid users = drive
  read only = no
  force user = root
  # JuiceFS internal files, not for the Finder
  veto files = /.accesslog/.config/.stats/.trash/
