<title>Concept H - i caricamenti nel pannello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  Concept H: come il pannello dice a chi copia su Floppy cosa sta caricando, cosa aspetta e
  cosa non è arrivato.
  Tasti: x a b c per la variante, t tema, p nasconde la barra; gli scenari si scelgono coi
  bottoni sopra il pannello.

  Il problema, misurato il 01/11/2026 sul Mac di sviluppo:
  - Le copie di questo Mac non si vedono: il pannello mostra solo i file in arrivo dai colleghi.
  - La barra del Finder arriva in fondo prima del tempo: JuiceFS prende i dati in memoria e li
    invia dopo, così una copia "finita" ha ancora centinaia di MB da mandare (500 MB passati al
    disco in 15 s, inviati in 100 s a 40 Mbit/s).
  - Senza linea il caricamento aspetta e riprende da solo (una copia da 500 MB con 60 s di
    interruzione è arrivata intera, verificata col checksum). Lo stato "in pausa" esiste.
  - Una copia del Finder che fallisce lascia il file troncato col nome giusto: 688 MB di 2 GB,
    al suo posto nella cartella. Il Finder lo marca come copia in corso (tipo "brok", icona
    grigia) e la marca resta; una copia riuscita la toglie. Chi monta in CapCut lo trova lì e
    non sa che è rotto.
  - Le clip della Sony (C0272.MP4, 8,8 GB) e le registrazioni dello schermo hanno l'indice
    (moov) in fondo, gli export di CapCut in cima: in entrambi i casi un video troncato si
    riconosce dalle dimensioni interne che non tornano con quella del file.

  X  oggi: le copie di questo Mac non compaiono; un fallimento lo dice solo il dialogo del Finder.
  A  lista: una sezione "In caricamento" sotto lo stato, una riga per file con il suo stato,
     come i download di un browser.
  B  una risposta: lo stato in cima risponde a "posso chiudere il Mac?" (cosa manca e quanto),
     il faceplate riempie lo slot con l'invio; i file si aprono solo a richiesta.
  C  sul progetto: niente sezione nuova, il caricamento sta sulla riga del progetto di
     destinazione, come gli arrivi dei colleghi; i file si vedono aprendo il disco.

  In tutte, per i casi gravi: una notifica di macOS a caricamento finito (solo se il pannello
  è chiuso) e per una copia non completata, e un avviso nel pannello che resta finché il file
  non viene ricopiato, eliminato o nascosto.

  Mappatura sul codice di oggi (fattibilità, non piano):
  - Poggia su: i file aperti in scrittura che floppy-activity già legge da Samba (la tabella
    writing, oggi solo per i colleghi), la dimensione del file mentre cresce, le metriche di
    JuiceFS per disco (juicefs_used_buffer_size_bytes: scritto e non ancora inviato;
    juicefs_object_request_data_bytes_PUT: inviato, da cui la velocità), il modo del disco
    (collegato, sola lettura, offline) per la pausa.
  - Nuovo nella VM: alla chiusura di un file, la marca "brok" del Finder letta dallo xattr
    user.DosStream.AFP_AfpInfo:$DATA (byte 16-19), e per .mov/.mp4/.m4v il controllo degli
    atomi; un registro dei caricamenti recenti con il loro esito, servito da `floppy activity`.
  - Nuovo nell'app: lo stato dei caricamenti nello snapshot dell'attività, la sezione o la riga,
    le notifiche, "Elimina la copia incompleta" (finisce nel cestino di Floppy, recuperabile).
  - Il tempo che manca è per disco, non per file: JuiceFS non dice quanto di un singolo file
    è ancora in memoria. Per file si sa quanto è stato scritto e se è chiuso.

  Giro 2 (01/11/2026): piace C, ma il non completato occupa troppo spazio. Due versioni compatte
  come sottovarianti di C, il resto di C invariato:
    c1 avviso corto: nello stato una riga sola (il file, quanto è arrivato), le azioni nel menu
       dei tre puntini come quelle dei dischi.
    c2 solo sulla riga: nessun avviso nello stato; il file incompleto compare da solo sotto il suo
       progetto, con il suo menu. Lo segnalano il faceplate rosso, la riga del disco e la notifica.

  Dati: nomi dei file sul modello di un disco vero (clip della Sony, export di CapCut,
  registrazioni dello schermo); dimensioni vere, velocità di una linea da 40 Mbit/s
  come quella misurata. Lo scenario "Tanti file" (48 clip di una scheda) è inventato.
-->
<style>

  --ink: #efece5; --ink-2: #a29e95; --ink-3: #8f8b83;

  --bezel: #0f0f0e; --bezel-lift: rgba(255,255,255,.06);

  --nb-bg: rgba(44,43,40,.94); --nb-line: rgba(255,255,255,.1);

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font: 14px/1.45 var(--f-ui); }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }

/* Concept chrome: not part of the design. */
.switch { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: #111; color: #aaa; font: 12px/1.4 var(--f-ro); }

.switch p { margin: 0 0 0 8px; flex: 1 1 240px; min-width: 0; }
body[data-chrome='off'] .switch, body[data-chrome='off'] .scen { display: none; }

.stage { display: grid; grid-template-columns: 352px minmax(260px, 1fr); gap: 36px; padding: 28px 32px 80px; align-items: start; }
.scen { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.scen button { border: 0; padding: 6px 11px; border-radius: 8px; background: var(--sunken); color: var(--ink-2); font-size: 13px; font-weight: 500; }

.side { max-width: 62ch; color: var(--ink-2); font-size: 13.5px; }
.side h2 { margin: 0 0 6px; color: var(--ink); font-size: 16px; }
.side p { margin: 0 0 10px; }
.side .finder { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--sunken); }
.side .finder b { color: var(--ink); }

/* The panel, values from app/src (Panel.tsx, ui.tsx, tokens.css). */
.panel { width: 352px; background: var(--surface); border-radius: 20px; box-shadow: var(--pop-shadow); overflow: hidden; position: relative; }
.face { margin: 8px 8px 0; display: block; }
.status { display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 22px; }
.status h1 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }

.btn.primary { background: var(--ink); color: var(--surface); font-weight: 600; }
.btn.soft { background: var(--sunken); color: var(--ink); font-weight: 600; }
.btn.raised { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 .5px rgba(0,0,0,.12); }
.btn.ghost { background: transparent; color: var(--ink-2); font-weight: 500; }
.btn.lg { height: 44px; padding: 0 16px; font-size: 14px; border-radius: 12px; flex: 1; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
.btn.md { height: 36px; padding: 0 13px; font-size: 13px; border-radius: 10px; }
.notice { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--sunken); border-radius: 10px; font-size: 13px; line-height: 1.45; }
.notice b.t { display: block; font-weight: 700; }
.notice .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.notice .mono { font: 11.5px var(--f-ro); color: var(--ink-2); }
.confirm { border-radius: 12px; background: var(--raised); padding: 14px; box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 12px 28px -12px rgba(40,30,20,.35); }
.confirm b { display: block; font-size: 14px; margin-bottom: 4px; }
.confirm p { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); }
.confirm .row2 { display: flex; gap: 8px; }
.confirm .row2 .btn { flex: 1; }

.led { display: inline-grid; place-items: center; flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--bezel); box-shadow: inset 0 1px 1.5px rgba(0,0,0,.35), 0 1px 0 var(--bezel-lift); }
.led::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgba(138,134,125,.35); }
.led[data-s="ok"]::after { background: var(--led-ok); }
.led[data-s="dl"]::after { background: var(--led-dl); }
.led[data-s="err"]::after { background: var(--led-err); }
.led[data-s]::after { box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 -1px 1px rgba(0,0,0,.25); }
.led[data-blink]::after { animation: blink 1.1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.face-blink { animation: blink 1.1s steps(2, jump-none) infinite; }
@media (prefers-reduced-motion: reduce) { .led[data-blink]::after, .face-blink { animation: none; } }
.ro { font: 11px var(--f-ro); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); white-space: nowrap; }
.slot-mark { display: inline-block; flex: none; width: 12px; height: 4px; border-radius: 2px; background: var(--ink-3); box-shadow: inset 0 1px 1px rgba(0,0,0,.3); margin-right: 10px; }

.space { padding: 0 20px 18px; }
.space .h, .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
.space .h b, .sec-h b { font: 12px var(--f-ro); font-weight: 400; letter-spacing: .02em; text-transform: none; color: var(--ink); }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.legend li { display: flex; align-items: center; font-size: 12.5px; }
.legend li span:nth-child(2) { flex: 1; color: var(--ink-2); }
.legend li span:last-child { font: 12px var(--f-ro); }

.list { margin: 0 8px; background: var(--sunken); border-radius: 14px; padding: 14px 4px 6px; }
.list .sec-h { padding: 0 12px; margin-bottom: 4px; color: var(--ink-2); }
.drow { position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 4px 0 12px; border-radius: 10px; }
.drow .b { flex: 1; min-width: 0; padding: 6px 0; }
.drow .n { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.drow .l { display: block; margin-top: 1px; font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.drow .led { margin-right: 9px; margin-left: -1px; }
.drow .ro { margin: 0 4px 0 12px; }
.dots { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2); flex: none; }
.tree { margin: 0 0 4px 18px; padding-left: 8px; border-left: 1px solid var(--line); }
.frow { display: flex; align-items: center; min-height: 36px; padding: 0 4px 0 10px; border-radius: 10px; }
.frow .b { flex: 1; min-width: 0; padding: 4px 0; }
.frow .n { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .l { display: block; font-size: 12px; line-height: 1.35; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .led { margin-right: 9px; margin-left: -1px; }
.frow .ro { margin: 0 4px 0 8px; }
svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ficon { color: var(--ink-3); margin-right: 8px; }

/* Upload rows (A, and the list B opens, and C's files). */
.up { padding: 0 8px; }
.urow { display: flex; align-items: flex-start; gap: 9px; padding: 8px 6px 8px 8px; border-radius: 10px; }
.urow .led { margin-top: 2px; }
.urow .b { flex: 1; min-width: 0; }
.urow .n { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.urow .l { display: block; font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.urow .ro { margin-top: 1px; }
.bar { position: relative; height: 4px; margin-top: 6px; border-radius: 2px; background: var(--track); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--ink-3); }
.more { display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 6px 8px 8px 31px; font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.uphead { display: flex; gap: 8px; white-space: nowrap; align-items: baseline; justify-content: space-between; padding: 0 20px; margin-bottom: 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.uphead b { font: 12px var(--f-ro); font-weight: 400; letter-spacing: .02em; text-transform: none; color: var(--ink); }
.upwrap { padding-bottom: 14px; }
.toggle { border: 0; background: transparent; padding: 0; font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; align-self: flex-start; }

footer.f { display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 20px; font-size: 12px; color: var(--ink-3); }
footer.f .v { margin-right: auto; font: 12px var(--f-ro); }

/* The floating row menu (concept G, variant A). */
.pop { position: absolute; right: 6px; z-index: 5; width: 250px; background: var(--menu); border-radius: 12px; padding: 5px; box-shadow: var(--menu-shadow); }
.pop .mi { display: grid; grid-template-columns: 18px 1fr; column-gap: 10px; align-items: center; width: 100%; padding: 6px 9px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 13px; color: var(--ink); }
.pop .mi:hover { background: var(--sunken); }
.pop .mi svg { color: var(--ink-2); }
.pop .mi small { grid-column: 2; font-size: 11.5px; color: var(--ink-2); line-height: 1.35; }
.pop .sep { height: 1px; background: var(--line); margin: 4px 8px; }
.pop .head { padding: 6px 9px 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.short .b { flex: 1; min-width: 0; }
.short b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.short .l { display: block; font-size: 12px; color: var(--ink-2); }
button.dots { border: 0; background: transparent; }
button.dots[aria-expanded="true"] { background: var(--raised); color: var(--ink); }
.frow { position: relative; }

/* A macOS notification, for the cases that send one. */
.nb { position: fixed; top: 54px; right: 18px; z-index: 50; width: 344px; display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: start; padding: 11px 13px; border-radius: 16px; background: var(--nb-bg); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: 0 0 0 .5px var(--nb-line), 0 12px 32px -8px rgba(0,0,0,.35); font: 13px/1.35 -apple-system, "SF Pro Text", sans-serif; color: var(--ink); }
.nb .ic { width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(#3a3835, #1c1b19); display: grid; place-items: center; }
.nb .ic::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--nb-led, #3fdc6c); }
.nb b { display: block; font-weight: 600; }
.nb small { color: var(--ink-2); font-size: 12px; }
</style>

<script>
const DESC = {
  x: 'oggi: le copie di questo Mac non si vedono, un fallimento lo dice solo il Finder',
  a: 'lista: una sezione "In caricamento" con una riga per file e il suo stato, come i download di un browser',
  b: 'una risposta: lo stato in cima dice se si può chiudere il Mac e quanto manca; i file a richiesta',
  c: 'sul progetto: il caricamento sta sulla riga del progetto di destinazione, come gli arrivi dei colleghi',
  c1: 'avviso corto: C con il non completato in una riga sola nello stato, le azioni nel menu',
  c2: 'solo sulla riga: C senza avviso nello stato, il file incompleto sotto il suo progetto con il suo menu',
};

// Scenarios: one copy session seen at different moments. Sizes in MB.
const LINE = 40; // Mbit/s
const files = {
  sony: { name: 'C0272.MP4', size: 8792 },
  sony2: { name: 'C0315.MP4', size: 1007 },
  pill: { name: 'Montaggio finale.mp4', size: 139 },
  rec: { name: 'Registrazione schermo 2026-10-26 alle 13.16.21.mov', size: 412 },
  zip: { name: 'Grafiche Spot Natale.zip', size: 236 },
};
const PROJECT = 'Marketing / growth';
const SCEN = {
  up: {
    label: 'In caricamento',
    // st: sending (written, being uploaded), writing (the Mac is still writing), done, failed, check
    rows: [
      { f: files.sony, st: 'sending', written: 8792 },
      { f: files.sony2, st: 'writing', written: 420 },
      { f: files.pill, st: 'done' },

    pending: 1520, paused: false,

  pause: {
    label: 'In pausa',
    rows: [

      { f: files.sony2, st: 'writing', written: 610 },

    side: ['La connessione è caduta da 40 secondi. JuiceFS tiene i dati e riprende da solo quando torna; il Finder resta fermo sulla copia ancora aperta.', 'Il Finder: la seconda copia si ferma. Se la connessione non torna entro qualche minuto, il Finder la dà per fallita e lascia il file a metà.'],
  },
  done: {
    label: 'Caricato',
    rows: [
      { f: files.sony, st: 'done' },
      { f: files.sony2, st: 'done' },
      { f: files.pill, st: 'done' },
    ],
    pending: 0, paused: false, notif: 'done',
    side: ['Tutto inviato. Per i video Floppy ha anche controllato che il file sia intero (la struttura del video torna con la sua dimensione). Le righe restano 10 minuti, poi passano nell\'Attività.', 'Una notifica di macOS arriva solo se il pannello è chiuso: chi ha lasciato il Mac a caricare sa che può chiuderlo.'],

    side: ['La connessione è mancata per troppo tempo e il Finder ha rinunciato a C0272.MP4: sul disco c\'è un file con quel nome che contiene solo 2,1 GB di 8,8. Il Finder lo mostra con l\'icona grigia; CapCut lo apre e si ferma a metà.', 'Floppy lo riconosce dalla marca che il Finder lascia sui file non finiti, o per i video dalla struttura che non torna. L\'avviso resta finché il file non viene ricopiato, eliminato o nascosto. "Elimina la copia incompleta" lo manda nel cestino di Floppy: si può rimettere.'],
  },
  check: {
    label: 'Da controllare',
    rows: [
      { f: files.zip, st: 'check' },
      { f: files.pill, st: 'done' },

// What one upload row says, shared by the variants.
function rowLook(r, paused) {
  switch (r.st) {
    case 'writing': return { led: 'dl', blink: !paused, ro: paused ? 'In pausa' : 'In copia', line: `${gb(r.written)} di ${gb(r.f.size)} copiati`, prog: r.written / r.f.size };

    case 'queued': return { led: null, ro: 'In coda', line: 'Il Finder lo copia dopo', prog: null };
    case 'done': return { led: 'ok', ro: 'Caricato', line: `${gb(r.f.size)} · su Floppy, video intero`, prog: null };
    case 'failed': return { led: 'err', ro: 'Incompleto', line: `Arrivati ${gb(r.written)} di ${gb(r.f.size)}`, prog: null };
    case 'check': return { led: 'dl', ro: 'Da controllare', line: 'La connessione è caduta mentre si salvava', prog: null };

}
function urow(r, paused) {
  const k = rowLook(r, paused);

}
// The rows worth showing: problems first, then what moves, then the last done; the rest summed up.
function visibleRows(rows, max = 4) {

  const sorted = [...rows].sort((a, b) => order[a.st] - order[b.st]);
  return { shown: sorted.slice(0, max), rest: sorted.slice(max) };
}
function restLine(rest) {

const counts = (rows) => ({

// The status section's title and body, per variant.
function statusCopy(v, sc, sub = v) {

function faceFor(v, sc) {

  if (c.failed.length) return { ledc: 'err', readout: 'INCOMPLETO', ...cache };
  if (sc.paused) return { ledc: 'dl', readout: 'IN PAUSA', ...(v === 'b' ? sendFill(sc) : cache) };
  if (c.moving) return { ledc: 'dl', blink: true, readout: 'INVIO', activity: true, ...(v === 'b' ? sendFill(sc) : cache) };

function diskList(sub, sc, state) {

    done: 'Niente dice che i file sono arrivati; la barra del Finder era in fondo già prima.',
    failed: 'Il pannello dice "collegato" e non sa niente della copia fallita. Resta il dialogo del Finder, se qualcuno lo guarda, e il file a metà col nome giusto.',
    check: 'Niente: il file c\'è e sembra a posto.',
    many: 'Niente: solo la finestra di copia del Finder, con le ore che mancano calcolate sulla sua velocità, non su quella dell\'invio.',
  }[state.scen];
  return [t, 'Oggi l\'unica traccia è nel Finder, e per i caricamenti il Finder sbaglia: misura quanto è passato alla VM, non quanto è arrivato a Floppy.'];
}

const state = { scen: 'up', list: false, open: false, hidden: false, confirm: null };
document.querySelector('[data-scen]').innerHTML = Object.entries(SCEN).map(([k, s]) => `<button data-scen-k="${k}">${s.label}</button>`).join('');
const setScen = (k) => {
  Object.assign(state, { scen: k, hidden: false, confirm: null, fmenu: false });
  document.querySelectorAll('[data-scen-k]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scenK === k)));
  render();
};
document.querySelector('[data-scen]').addEventListener('click', (e) => { const b = e.target.closest('[data-scen-k]'); if (b) setScen(b.dataset.scenK); });
document.querySelector('[data-panel]').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'list') state.list = !state.list;
  if (a === 'open') state.open = !state.open;
  if (a === 'hide') { state.hidden = true; state.fmenu = false; }
  if (a === 'fmenu') state.fmenu = !state.fmenu;
  if (a === 'ask') { state.confirm = b.dataset.file; state.fmenu = false; }
  if (a === 'cancel') state.confirm = null;
  if (a === 'del') { state.confirm = null; state.hidden = true; }
  render();
});

// Template mechanics: variant buttons, keys, hash, theme.
const KEY = `concept:${location.pathname}`;
const root = document.documentElement, body = document.body;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
const name = (v) => DESC[v].split(':')[0];
const baseOf = (v) => v.replace(/\d+$/, '');
document.querySelector('[data-buttons]').innerHTML = Object.keys(DESC).map((v) => `<button data-v="${v}">${/\d$/.test(v) ? `${v.slice(-1)} ${baseOf(v).toUpperCase()}` : v.toUpperCase()} ${name(v)}</button>`).join(' ');
const pick = (v) => {
  if (!DESC[v]) return;
  body.dataset.v = v;
  document.querySelectorAll('.switch [data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  document.querySelector('[data-desc]').textContent = DESC[v];
  history.replaceState(null, '', `${location.search}#${v}`);
  state.list = false; state.open = false; state.fmenu = false; state.confirm = null; state.hidden = false;
  render();
};
const setTheme = (t) => { root.dataset.theme = t; save({ ...load(), theme: t }); };
document.querySelector('.switch').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) pick(b.dataset.v); });
document.querySelector('[data-theme-toggle]').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select, [contenteditable]')) return;
  const k = e.key.toLowerCase();
  if (k === 't') setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  else if (k === 'p') body.dataset.chrome = body.dataset.chrome === 'off' ? 'on' : 'off';
  else if (/^\d$/.test(k)) pick(`${baseOf(body.dataset.v)}${k}`);
  else pick(k);
});
root.dataset.theme = load().theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setScen(SCEN[new URLSearchParams(location.search).get('s')] ? new URLSearchParams(location.search).get('s') : 'up');
pick(DESC[location.hash.slice(1)] ? location.hash.slice(1) : 'x');
// ?m=1 opens the incomplete file's menu, for a screenshot.
if (new URLSearchParams(location.search).get('m')) { state.fmenu = true; render(); }
</script>
</body>
</html>
