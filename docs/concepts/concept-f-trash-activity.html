<!--
  Concept F: come un team si accorge di cosa succede su un disco condiviso e come rimedia a un
  errore. Quattro superfici: il cestino, l'attività di un disco, gli stati dal vivo (un file che
  arriva, un progetto in uso), le notifiche con Annulla. Per ognuna X (oggi) e tre varianti A, B, C,
  con i compromessi e la consigliata.
  Tasti: t tema, p nasconde barra, didascalie e decisioni per guardare pulito. L'indice in alto porta
  alle superfici. Deviazione voluta dal template, come concept-c e concept-e: non c'è una lettera
  globale, perché le decisioni sono quattro; Simone sceglie per superficie ("cestino B, notifiche C").

  Il problema, misurato il 18/10/2026:
  - Il Finder su Floppy cancella subito: niente va nel Cestino del Mac, e il suo avviso dice "Non puoi
    annullare questa azione". JuiceFS invece tiene i file cancellati 7 giorni in un .trash nascosto,
    a cartelle per ora e con nomi tecnici (2-3-nome.txt): oggi può ripristinare solo Simone, a mano.
  - Un salvataggio con file temporaneo e rinomina lascia la versione di prima nel cestino
    ("Sostituito"); un salvataggio che riscrive lo stesso file non lascia niente. Le cartelle
    cancellate JuiceFS le rimette dov'erano (juicefs restore).
  - Una clip che un collega sta copiando è visibile agli altri dal primo secondo a 0 byte e cresce a
    passi di 64 MB (455 MB in 56 s); il segno "in copia" del Finder gli altri lo vedono solo nei primi 2 s.
  - CapCut cerca i file per percorso completo: rinominare o spostare la cartella di un progetto
    scollega i video nei progetti di tutti i colleghi.

  Superfici e varianti (la scommessa, non l'aspetto):
  1 Cestino
    A Nel pannello: una pagina del pannello, aperta dal menu del disco. Nessuna superficie nuova.
    B Finestra Cestino: una finestra come Impostazioni, un disco per riga a sinistra. Il modello del
      Cestino del Finder, con spazio per cartelle, sostituiti e ricerca. CONSIGLIATA.
    C Nel web: il cestino è una scheda del disco nel web del team; l'app apre il browser. Un posto solo,
      anche da un Mac spento, ma serve l'accesso al web per chi monta.
  2 Attività di un disco
    A Finestra del disco: la stessa finestra del cestino con due schede, Attività e Cestino: una
      cancellazione è un evento e una voce del cestino, la stessa cosa vista dai due lati. CONSIGLIATA.
    B Registro del web: gli eventi dei file nel Registro che c'è già, con il filtro File. Solo admin.
    C Nel pannello: un riassunto di oggi dentro la riga del disco, il resto nel web.
  3 Stati dal vivo
    A Sulla riga: In arrivo e In uso sulle righe dei progetti nel pannello, e basta.
    B Nascosti finché non sono completi: chi non copia non vede il file finché non è chiuso.
    C Riga e avviso quando lo apri: la riga di A più una notifica nel momento del rischio, quando
      il Mac apre un file che un collega sta ancora scrivendo. CONSIGLIATA.
  4 Notifiche con Annulla
    A Pulsante nella notifica: Annulla dentro la notifica di macOS, a chi lo fa e ai colleghi.
    B Solo a chi lo fa: chi cancella o rinomina riceve l'avviso con Annulla, i colleghi lo leggono
      nell'attività.
    C Notifica più avviso nel pannello: la notifica informa, l'Annulla vive nel pannello finché serve,
      per chi lo fa e per i colleghi. CONSIGLIATA.

  Mappatura sul codice di oggi (fattibilità, non piano):
  - Pannello (app/src/features/panel/Panel.tsx): le righe dei dischi e dei progetti ci sono già, con LED,
    lettura e riga sotto; il menu del disco ha Mostra nel Finder, Libera spazio, Spegni su questo Mac.
    Nuove voci: Attività, Cestino. La finestra del disco è una terza finestra Tauri come Impostazioni
    e Benvenuto.
  - Cestino: si legge nella VM, dove il disco è montato (.trash alla radice di ogni disco, solo root):
    un comando nuovo del motore, floppy trash list|restore --json, senza control plane. Ripristinare è
    un'operazione sui metadata; il nome "(ripristinato)" quando il posto è occupato lo fa Floppy, perché
    juicefs restore --put-back non sovrascrive ma lascia il file nel cestino (da verificare sullo spike,
    come lo spostamento fuori da .trash). Una cartella si ripristina con tutto il contenuto.
  - Chi ha cancellato: JuiceFS non lo sa. Viene dall'attività: ogni VM registra le operazioni di Samba
    (vfs_full_audit: create, rename, unlink, open in scrittura) e le manda al control plane, che sa di
    chi è ogni dispositivo. Una voce del cestino senza evento corrispondente dice "non registrato".
  - Attività: tabella nuova nel control plane, eventi raggruppati prima di salvarli (Samba moltiplica le
    operazioni: 300 file dal Finder sono circa 2.700 operazioni), letti dall'app e dal web con la stessa
    API. Una VM senza rete tiene gli eventi e li manda dopo: arrivano in ritardo, con l'ora vera.
  - Stati dal vivo: un file aperto in scrittura da un'altra VM, la sua dimensione che cresce. La
    percentuale non c'è: il Finder non dichiara la dimensione finale (0 byte al primo secondo,
    misurato), quindi si mostrano i MB arrivati e la velocità, e "completo" quando la VM che scrive
    chiude il file. B richiede un filtro nella VM (modulo VFS di Samba o la JuiceFS patchata) che
    nasconde i file segnati "in scrittura": il lavoro più grosso del concept, non misurato.
  - Notifiche: oggi il plugin di Tauri, senza pulsanti su macOS desktop (le azioni sono solo mobile).
    A richiede codice nativo (UNUserNotificationCenter, che vuole un'app firmata, o NSUserNotification,
    deprecata) e in stile Banner il pulsante compare solo al passaggio del mouse. Le notifiche a chi
    cancella sono locali (la sua VM vede le 120 cancellazioni); quelle ai colleghi passano dal control
    plane, quindi qualche secondo dopo.
  - Accesso: chi ha un disco in sola lettura vede cestino e attività ma non ripristina e non annulla;
    dentro un disco i permessi sono tutto o niente (ARCHITECTURE, "Access and security").

  Dati: inventati e plausibili, nello stesso mondo di concept-c ed concept-e: organizzazione "Studio
  Esempio", disco "Progetti" (scrittura), "Archivio 2025" (sola lettura per Giulia), "Consegne" (vuoto);
  questo Mac è di Giulia, admin è Simone, Marco è un collega. Progetti, clip e dimensioni inventati;
  i 7 giorni del cestino, i passi da 64 MB e i 455 MB in 56 s sono misurati. Oggi è domenica 18 ottobre
  2026, le 16:22. Nel pannello l'animazione dell'arrivo va quattro volte più veloce del vero.

  Decisioni aperte e raccomandazione (dettaglio nei blocchi di ogni superficie):
  1 Cestino: B, una finestra. 2 Attività: A, nella stessa finestra del cestino. 3 Stati dal vivo: C.
  4 Notifiche: C. Insieme fanno una finestra del disco con due schede, aperta dal menu del disco e
  dalle notifiche; il web del team avrà la stessa API per gli admin, dopo.
  Domande per Simone: la soglia della cancellazione di massa; chi vede l'attività (anche la sola
  lettura?) e per quanto; registrare anche le aperture in lettura (serve per "In uso" in CapCut e per
  sapere chi ha usato i video rinominati); chi può annullare la rinomina di un collega.
-->

.switch a:hover { background: #333; }
.switch button { font: inherit; border: 0; padding: 5px 9px; border-radius: 6px; background: #262626; color: #eee; cursor: pointer; }
body[data-chrome="off"] .switch, body[data-chrome="off"] .cap, body[data-chrome="off"] .group-h p, body[data-chrome="off"] .why, body[data-chrome="off"] .var-h p, body[data-chrome="off"] .trade, body[data-chrome="off"] .decision { display: none; }

/* Desktop strip */

/* 1. Trash */
function trashPanelPage(o) {
  const s = S.tA;

  const days = TRASH[disk];
  let list;
  if (!days.length) list = `<div class="empty-p"><b>Il cestino è vuoto</b>Quello che cancelli da ${DISKS.find((d) => d.id === disk).name} resta qui 7 giorni. Il Finder lo cancella subito, Floppy no.</div>`;
  else list = days.map((g) => {
    const items = g.items.filter((it) => matches(it, o.static ? "" : s.q, o.static ? "all" : s.kind));

    return `<div class="pday"><span>${g.day}</span><span class="lettura">${leftText(g.left)}</span></div>${items.map((it) => {
      const done = !o.static && s.done[it.id];

      const act = ro || done ? "" : `<button class="icon-btn" title="${it.kind === "rep" ? "Ripristina come copia" : "Ripristina"}" aria-label="Ripristina ${esc(it.name)}" data-a="restore" data-f="tA" data-id="${it.id}">${icon("undo")}</button>`;
      return `<div class="pitem">${icon(it.folder ? "folder" : /\.(mov|mp4)$/.test(it.name) ? "video" : "file", 16)}<div class="mid"><span>${esc(it.name)}${it.folder ? ` · ${it.count} file` : ""}</span>${line}</div>${act}</div>`;
    }).join("")}`;
  }).join("") || `<div class="empty-p"><b>Nessun risultato</b>Niente nel cestino con «${esc(s.q)}».</div>`;
  const roNote = ro ? `<div style="padding:0 14px 6px"><div class="notice"><span class="ic"><span class="fessura"></span></span><span class="body">Archivio 2025 è in sola lettura per te: vedi cosa è stato cancellato, per ripristinarlo chiedi a Simone o a Marco.</span></div></div>` : "";
  const tools = days.length && !o.static ? `<div class="ptool"><label class="search full">${icon("search", 14)}<input class="inp" placeholder="Cerca nel cestino" value="${esc(s.q)}" data-q="tA" aria-label="Cerca nel cestino"></label><div class="seg full" role="group" aria-label="Tipo">${[["all", "Tutto"], ["del", "Cancellati"], ["rep", "Sostituiti"]].map(([k, t]) => `<button aria-pressed="${s.kind === k}" data-a="kind" data-f="tA" data-id="${k}">${t}</button>`).join("")}</div></div>` : "";

}

function trashList(state, f, disk, opts = {}) {
  const ro = !DISKS.find((d) => d.id === disk).write;
  const days = TRASH[disk];
  const name = DISKS.find((d) => d.id === disk).name;
  if (!days.length) return `<div class="empty-w">${icon("trash", 28, 1.4)}<b>Il cestino di ${name} è vuoto</b><p>Quello che si cancella da ${name} resta qui 7 giorni, poi se ne va da solo. Il Finder lo cancella subito, Floppy no.</p></div>`;
  const tool = `<div class="tool"><label class="search">${icon("search", 14)}<input class="inp" placeholder="Cerca nome, cartella o persona" value="${esc(state.q)}" data-q="${f}" aria-label="Cerca nel cestino"></label><div class="seg" role="group" aria-label="Tipo">${[["all", "Tutto"], ["del", "Cancellati"], ["rep", "Sostituiti"]].map(([k, t]) => `<button aria-pressed="${state.kind === k}" data-a="kind" data-f="${f}" data-id="${k}">${t}</button>`).join("")}</div><span class="grow"></span><span class="lettura">${DISKS.find((d) => d.id === disk).count} elementi · ${DISKS.find((d) => d.id === disk).size}</span></div>`;
  const roNote = ro ? `<div class="notice ro-note"><span class="ic"><span class="fessura"></span></span><span class="body">${name} è in sola lettura per te: vedi cosa è stato cancellato, ma per ripristinarlo serve chi può modificare il disco, Simone o Marco.</span></div>` : "";
  const body = days.map((g) => {
    const items = g.items.filter((it) => matches(it, state.q, state.kind));
    if (!items.length) return "";
    return `<div class="day"><b>${g.day}</b><span class="lettura">${leftText(g.left)}</span></div><div class="twrap">${items.map((it) => trashRow(it, state, f, ro)).join("")}</div>`;
  }).join("") || `<div class="empty-w" style="padding:60px 20px"><b>Nessun risultato</b><p>Niente nel cestino di ${name} con «${esc(state.q)}»${state.kind !== "all" ? " fra i " + (state.kind === "del" ? "cancellati" : "sostituiti") : ""}.</p><p><button class="linkish" data-a="clear" data-f="${f}">Togli i filtri</button></p></div>`;
  const foot = `<p class="tfoot"><span class="fessura"></span><span>Dopo 7 giorni un elemento lascia il cestino da solo. Finché c'è, occupa spazio nel bucket del team.${opts.footExtra || ""}</span></p>`;
  return tool + roNote + body + foot;
}
function trashRow(it, state, f, ro) {

  const exp = it.folder ? `<button class="icon-btn" style="width:22px;height:22px;margin-left:-2px" aria-label="Mostra il contenuto" data-a="open" data-f="${f}" data-id="${it.id}">${icon(state.open && state.open[it.id] ? "down" : "right", 13)}</button>` : "";

  if (done) return `<div class="trow">${ic}${nm}<div class="done"><span>${led("ok")} ${doneText(it)}</span><button class="btn btn-soft">Mostra nel Finder</button></div></div>`;
  const label = it.kind === "rep" ? "Ripristina come copia" : it.folder ? "Ripristina la cartella" : "Ripristina";
  const act = ro ? "" : `<button class="btn btn-soft" data-a="restore" data-f="${f}" data-id="${it.id}">${icon("undo", 14)}${label}</button>`;
  const kids = it.folder && state.open && state.open[it.id] ? `<div class="kids">${it.kids.map(([n, sz]) => `<div><span>${n}</span><span>${sz}</span></div>`).join("")}<div><span>e altri ${it.count - it.kids.length} file</span><span></span></div></div>` : "";
  return `<div class="trow">${ic}${nm}<span class="who${it.who === null ? " none" : ""}" title="${it.who === null ? "Cancellato prima che Floppy registrasse l'attività di questo disco" : ""}">${whoText(it.who)}</span><span class="when">${it.at}</span><span class="sz">${it.size}</span><span class="act">${act}</span></div>${kids}`;
}

  else if (s.ren === "confirm") ren = `<div class="confirm"><b>Rimettere il nome di prima?</b><p>La cartella torna Fondazione Lirica - Backstage e Marco riceve un avviso. Se nel frattempo ha già ricollegato i suoi progetti, a lui si scollegano di nuovo.</p><div class="btns"><button class="btn btn-primary" data-a="nren" data-f="nC">Rimetti il nome</button><button class="btn btn-soft" data-a="nrencancel" data-f="nC">Annulla</button></div></div>`;
  else ren = `<div class="notice"><span class="ic">${led("ok")}</span><span><b>Nome di prima rimesso</b><span class="body">Fondazione Lirica - Backstage ha di nuovo il suo nome; Marco lo sa. I tuoi progetti CapCut ritrovano i video.</span></span></div>`;
  return panel({ notices: [del, ren], space: false, title: "Floppy è collegato", body: "I dischi del team sono nel Finder, dentro Floppy." });
}
function notifGroup() {

    <figure class="frame" id="4a1"><figcaption class="cap"><span class="id">4A1</span><b>Le due notifiche</b><span>La prima come Banner (il pulsante compare al passaggio del mouse, qui mostrato), la seconda come Avviso, che resta finché non si sceglie. Prova i pulsanti.</span></figcaption><div data-frame="4a1">${desk(notifDeskA())}</div></figure>`,
    ["<b>Il più veloce</b>: chi ha cancellato per sbaglio annulla nei 5 secondi del banner.", "<b>Il banner sparisce</b> e con lui l'Annulla; il pulsante si vede solo al passaggio del mouse, e lo stile Avviso lo sceglie l'utente nelle Impostazioni di sistema, non noi.", "Fattibilità: il plugin di Tauri non ha pulsanti su macOS desktop; serve codice nativo, e UNUserNotificationCenter vuole un'app firmata (oggi niente Developer ID, DECISIONS #10).", "Annullare la rinomina di un collega con un clic dal banner è troppo facile: a lui riscollega i progetti (vedi 4C)."], false);
  const B = variant("4B", "Solo a chi lo fa", "Avvisa solo chi ha cancellato o rinominato, con Annulla: è l'unico che può rimediare senza mettersi d'accordo con nessuno. I colleghi lo leggono nell'attività.", `
    <figure class="frame" id="4b1"><figcaption class="cap"><span class="id">4B1</span><b>Chi lo fa</b><span>Marco riceve l'avviso della sua rinomina con chi usa quei video; Giulia quello della sua cancellazione.</span></figcaption><div data-frame="4b1">${notifDeskB()}</div></figure>`,
    ["<b>Niente rumore</b> per chi non ha fatto niente, e l'avviso arriva subito: la VM di chi agisce vede le operazioni, senza passare dal control plane.", "<b>Giulia non sa</b> che i suoi progetti sono scollegati finché CapCut non le mostra i file mancanti, e non sa perché.", "«Giulia e Simone hanno aperto questi video» richiede di registrare le aperture in lettura; senza, la frase diventa «chi li usa in CapCut dovrà ricollegarli».", "Ha gli stessi limiti di A sui pulsanti nella notifica."], false);
  const C = variant("4C", "Notifica più avviso nel pannello", "La notifica informa, e un clic apre il pannello; l'Annulla vive in un avviso del pannello finché serve. Per chi lo fa e, per una rinomina, per chi vede il disco.", `
    ${frame("4c1", "Le notifiche", "Senza pulsanti: un clic apre il pannello sull'avviso.", desk(`<div class="notifs">${ntf("Hai cancellato 120 file da Progetti", "Girato grezzo resta nel cestino 7 giorni: lo ripristini dal pannello di Floppy.", "ora")}${ntf("Marco ha rinominato Fondazione Lirica - Backstage", "I progetti CapCut che usano quei video vanno ricollegati. Apri Floppy per annullare.", "2 min fa")}</div>`))}
    <figure class="frame" id="4c2"><figcaption class="cap"><span class="id">4C2</span><b>Gli avvisi nel pannello</b><span>Restano finché non li chiudi o finché l'Annulla non vale più. Annullare la rinomina di un collega chiede conferma. Prova i pulsanti.</span></figcaption><div data-frame="4c2">${desk(notifPanelC())}</div></figure>`,
    ["<b>Non si perde</b>: il banner dura 5 secondi, l'avviso resta nel pannello finché la cosa è risolta.", "<b>Fattibile oggi</b>: notifiche senza pulsanti, quelle che l'app manda già; il clic sulla notifica apre il pannello.", "La conferma sulla rinomina dice il costo vero: rimettere il nome scollega i progetti di chi aveva già ricollegato.", "Un clic in più di A per chi vuole annullare subito."], true);
  const D = decision(4, "Notifiche con Annulla", [
    "<b>Consigliata C.</b> Una cancellazione di massa e una rinomina sono errori che si scoprono dopo, non nei 5 secondi del banner: l'Annulla deve sopravvivere al banner. C funziona con le notifiche che l'app sa già mandare, avvisa anche i colleghi della rinomina (sono loro che ne pagano il costo) e mette una conferma dove annullare tocca il lavoro di un altro. A resta un miglioramento possibile quando l'app sarà firmata; B toglie l'informazione a chi la subisce.",
    "Da decidere:"
  ], ["La soglia della cancellazione di massa: una cartella, oppure più di 20 file o 5 GB in un minuto. Un file solo non manda niente: c'è il cestino.", "Fin quando vale Annulla: una cancellazione finché il cestino non si svuota; una rinomina finché nessuno ha toccato di nuovo quella cartella e il nome di prima è libero.", "Chi può annullare la rinomina di un collega: chiunque abbia il disco in scrittura (consiglio sì, con la conferma e l'avviso a chi l'ha fatta)."]);
  return group("notifiche", "04", "Notifiche con Annulla", "Due errori che costano: cancellare una cartella intera (il Finder dice che non si può annullare) e rinominare la cartella di un progetto (i progetti CapCut di tutti perdono i video).", A + B + C + D);
}

function build() {
  return [
    group("oggi", "00", "Oggi", "Cosa succede adesso quando qualcuno cancella, rinomina o copia su Floppy.", todayFrames()),

/* Re-render of a single frame, keeping focus in its search field */
const FRAMES = {
  "1a2": () => desk(trashPanelPage({})),
  "1b2": () => desk(trashWindow(), { align: "center", app: "Floppy" }),
  "1c2": () => trashWeb(),
  "2a2": () => desk(diskWindow(), { align: "center", app: "Floppy" }),
  "2b1": () => registryWeb(),
  "3a1": () => desk(liveFrames("a")),
  "3b1": () => liveFrames("b"),
  "3c1": () => desk(liveFrames("c")),
  "3c2": () => desk(liveNotifs()),
  "4a1": () => desk(notifDeskA()),
  "4b1": () => notifDeskB(),
  "4c2": () => desk(notifPanelC())
};
const OWNER = { tA: ["1a2"], tB: ["1b2", "2a2"], tC: ["1c2"], aA: ["2a2"], aB: ["2b1"], nA: ["4a1"], nB: ["4b1"], nC: ["4c2"] };
function refresh(ids) {
  const act = document.activeElement;
  const q = act && act.dataset ? act.dataset.q : null;
  const sel = q ? act.selectionStart : null;
  const scrolls = ids.map((id) => [...document.querySelectorAll(`[data-frame="${id}"] .desk, [data-frame="${id}"] .viewport`)].map((e) => e.scrollLeft));
  ids.forEach((id, i) => {
    const host = document.querySelector(`[data-frame="${id}"]`);
    if (!host) return;
    host.innerHTML = FRAMES[id]();
    host.querySelectorAll(".desk, .viewport").forEach((e, j) => { if (scrolls[i][j] != null) e.scrollLeft = scrolls[i][j]; });
  });
  if (q) {
    const again = document.querySelector(`[data-frame] input[data-q="${q}"]`);
    if (again) { again.focus(); again.setSelectionRange(sel, sel); }
  }
}

const TRASH_ID = (id) => Object.values(TRASH).flat().flatMap((g) => g.items).find((x) => x.id === id);
document.getElementById("stage").innerHTML = build();
document.getElementById("stage").addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const f = b.dataset.f, id = b.dataset.id, a = b.dataset.a, s = S[f];
  if (!s) return;
  if (a === "restore") s.done[id] = true;
  else if (a === "kind") s.kind = id;
  else if (a === "clear") { s.q = ""; s.kind = "all"; }
  else if (a === "disk") { s.disk = id; s.q = ""; s.kind = "all"; }
  else if (a === "open") s.open[id] = !s.open[id];
  else if (a === "who") s.who = id;
  else if (a === "type") s.type = id;
  else if (a === "clearact") { s.who = "all"; s.type = "all"; }
  else if (a === "evdone") s.done[id] = true;
  else if (a === "tab") { S.aA.tab = id; refresh(["2a2"]); return; }
  else if (a === "chip") s.chip = id;
  else if (a === "ndel") s.del = true;
  else if (a === "nren") s.ren = f === "nC" ? "done" : true;
  else if (a === "nrenask") s.ren = "confirm";
  else if (a === "nrencancel") s.ren = "notice";
  refresh(OWNER[f] || []);
});
document.getElementById("stage").addEventListener("input", (e) => {
  const q = e.target.dataset && e.target.dataset.q;
  if (!q) return;
  S[q].q = e.target.value;
  refresh(OWNER[q]);
});

/* The clip grows in 64 MB steps; the demo runs 4 times faster than measured (64 MB every 2 s). */
setInterval(() => {
  if (LIVE.done) {
    LIVE.hold += 1;
    if (LIVE.hold > 3) { LIVE.done = false; LIVE.mb = 0; LIVE.hold = 0; }
  } else if (LIVE.mb + 64 >= 455) { LIVE.done = true; }
  else LIVE.mb += 64;
  refresh(["3a1", "3b1", "3c1", "3c2"]);
  if (S.aA.tab === "act") {
    const n = document.querySelector('[data-frame="2a2"] .now .t');
    if (n) n.innerHTML = `<b>Marco</b> sta copiando in <b>Cantine Arnaldi - Vendemmia/Girato</b> · ${fmtMb(512 + liveMb())} finora`;
  }
}, 2000);

/* Concept chrome, from the mockup template */
const KEY = `concept:${location.pathname}`;
const root = document.documentElement, body = document.body;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
const setTheme = (t) => { root.dataset.theme = t; save({ ...load(), theme: t }); };
document.querySelector("[data-theme-toggle]").addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));
document.querySelector("[data-chrome-toggle]").addEventListener("click", () => (body.dataset.chrome = "off"));
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
  const k = e.key.toLowerCase();
  if (k === "t") setTheme(root.dataset.theme === "dark" ? "light" : "dark");
  else if (k === "p") body.dataset.chrome = body.dataset.chrome === "off" ? "on" : "off";
});
root.dataset.theme = load().theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.querySelector(".switch nav").addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  const t = document.getElementById(a.getAttribute("href").slice(1));
  if (t) scrollTo({ top: t.getBoundingClientRect().top + scrollY - document.querySelector(".switch").offsetHeight - 12 });
});
