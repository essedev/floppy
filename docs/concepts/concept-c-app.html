<title>Concept C - app</title>

<!--
  Concept C: l'app di Fluix per macOS nell'identità D Drive (scelta in concept-b-identity),
  superficie per superficie. Non è un file a varianti: è uno storyboard con ogni schermata e
  ogni stato a grandezza vera, e le decisioni aperte affiancate come A e B.
  Tasti: t tema, p nasconde barra e didascalie per guardare pulito. L'indice in alto porta ai gruppi.

  Il problema: concept-a-panel ha scelto la struttura (variante B, prima lo stato) e concept-b
  l'identità, ma mancano gli stati veri del prodotto: avvio, revoca, Mac quasi pieno,
  aggiornamento, il menu di riga, le impostazioni, le notifiche, l'icona nella barra dei menu.

  Superfici:
  1. Pannello: Collegato, Download in corso con la coda, Avvio, Non raggiungibile, Spento,
     Revocato, Mac quasi pieno, Aggiornamento disponibile.
  2. Menu di riga: Rendi disponibile, Libera spazio con conferma, progetto più grande della cache.
  3. Finestra Impostazioni: account, questo Mac, spazio, avvio al login, versione, diagnostica.
  4. Notifiche di macOS: download finito, disco ricollegato, spazio liberato da solo.
  5. Icona nella barra dei menu: collegato, download, avvio, non raggiungibile, spento.

  Mappatura sul codice di oggi (fattibilità, non piano): pannello e finestre sono React nella
  webview Tauri (scheletro di Portsage). Ogni stato del pannello viene da `fluix status --json`
  (da aggiungere: oggi status stampa testo) più il token del control plane per Revocato.
  Rendi disponibile e Libera spazio sono `fluix warmup` e `fluix free` per cartella; l'ETA usa
  la velocità misurata. "Mac quasi pieno" è la soglia che `tick` già usa (metà di RESERVE_MB,
  10 GB): sotto, l'agente libera tutta la cache. Il limite della cache in Impostazioni non
  può superare il disco della VM, fissato alla creazione: oltre serve reinstallare, e lo slider
  si ferma lì. Le notifiche sono quelle di sistema (plugin notification di Tauri). L'icona
  nella barra dei menu è un'immagine template monocromatica: il lampeggio sono due immagini
  alternate. Invia diagnostica manda al control plane stato, ultimi log di fluix e della VM,
  versione di macOS: è un endpoint nuovo.

  Dati: progetti, limite di 100 GB e velocità di 14,5 MB/s da concept-a-panel (nomi inventati
  lì e dichiarati). Inventati qui: l'organizzazione "Studio Esempio", la persona Giulia Ferri,
  il nome del Mac, il codice della diagnostica, la versione 0.2.0.

  Decisioni aperte e raccomandazione:
  1. Parola dell'azione: Spegni o Espelli. Consigliata Spegni: ferma anche la VM e fa coppia con
     Accendi; in macOS Espelli vuol dire solo smontare, e il disco tornerebbe da solo al tick.
  2. Cache piena: bloccare con "Serve spazio" o lasciare a JuiceFS di liberare i blocchi usati
     meno di recente, con un avviso. Consigliata la seconda: è quello che JuiceFS fa già al
     raggiungimento di --cache-size, e i blocchi che escono sono per definizione quelli non in uso.
  3. Riconnessione: automatica ogni 30 secondi con conto alla rovescia, o solo il pulsante.
     Consigliata l'automatica: chi monta non deve fare niente, il pulsante resta per riprovare subito.
  4. Impostazioni: finestra separata o seconda pagina del pannello. Consigliata la finestra:
     si apre di rado, è la convenzione del Mac (Cmd+,) e lascia il pannello a una cosa sola.
  Giro 2: "tutto ok", ma servono alternative per l'icona piccola e per il frontale nelle
  finestre. Aggiunta in testa "Decisione: il drive" con tre famiglie coerenti (Stucco, Grafite,
  Essenziale), ognuna con icona dell'app, icona della barra dei menu nei quattro stati, frontale
  nel pannello e lo stesso frontale in una finestra. Consigliata Grafite; il resto dello
  storyboard resta su Stucco finché Simone non sceglie. Tolta la scanalatura sotto "fluix" nel
  frontale (sembrava una barra di avanzamento vuota). Tolte le pillole: "Consigliata" ora è
  LED più testo, le lettere A e B sono testo semplice.
  Giro 3: il pallino colorato che si illumina (davanti a una frase, o su "Consigliata") è un
  dettaglio da kit generico come le pillole. Regola: un dettaglio generico non si toglie e basta,
  si sostituisce con uno che viene dall'oggetto drive. Aggiunta "Decisione: i dettagli" con A e B
  per quattro elementi, A consigliata e applicata in tutto lo storyboard. Tolti anche il bagliore
  dei LED nei frontali, il colore dei testi di stato e gli sfondi colorati degli avvisi.

  Giro 5: il concept diventa dinamico. Una riga "Scelte" nei controlli del concept (non fa parte
  del design) cambia frontale, icone, i quattro dettagli e le quattro decisioni del pannello, e
  ogni frame si ridisegna. Le scelte stanno nell'hash (#f=grafite&i=essenziale&led=ghiera...),
  quindi un link riproduce una configurazione, e in localStorage; "Ripristina consigliate"
  torna ai valori scelti. I blocchi di decisione restano il confronto fisso fra A e B.
  Aggiunto il frame R4 Cache piena, che segue la scelta.

  Giro 4: Simone sceglie Grafite per frontale, pannello e finestre, con le icone di Essenziale:
  niente contorno, solo fessura e LED sullo stesso asse orizzontale, come nel frontale. Tutto lo
  storyboard passa a Grafite. Icona dell'app su squircle grafite con la fessura chiara in una
  scanalatura scura e il LED nella ghiera; contrasto misurato su rendering a 128, 32 e 16 px
  (WCAG 1.4.11, almeno 3:1 per fessura e LED). Icona della barra dei menu: fessura alta 3 px,
  punto da 4,5 px, 2,75 px di distanza. Il set A dei dettagli resta.
  Scelta: Grafite con le icone di Essenziale.

  Marchio definitivo (da copiare così com'è; colori letterali, nessuna variabile).
  Icona dell'app, viewBox 124, squircle grafite, fessura chiara e LED sullo stesso asse y=62:
  <svg width="128" height="128" viewBox="0 0 124 124"><defs><linearGradient id="fx-sq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3835"/><stop offset="1" stop-color="#1c1b19"/></linearGradient></defs><rect x="4" y="4" width="116" height="116" rx="27" fill="url(#fx-sq)"/><rect x="4.5" y="4.5" width="115" height="115" rx="26.5" fill="none" stroke="#fff" stroke-opacity=".08"/><rect x="16" y="51" width="68" height="22" rx="11" fill="#0b0b0a"/><rect x="20" y="55" width="42" height="14" rx="7" fill="#d9d4c8"/><circle cx="100" cy="62" r="12.5" fill="#0b0b0a"/><circle cx="100" cy="62" r="8.5" fill="#ff6a2e"/><ellipse cx="100" cy="58.2" rx="4" ry="2" fill="#fff" opacity=".5"/></svg>
  Icona della barra dei menu, immagine template 24x16 (nero più alfa; macOS la colora):
  Collegato  <svg width="24" height="16" viewBox="0 0 24 16"><rect x="2" y="6.5" width="13" height="3" rx="1.5" fill="#000"/><circle cx="19.75" cy="8" r="2.25" fill="#000"/></svg>
  Download   due immagini alternate ogni 0,55 s: la Collegato, e la stessa senza il cerchio
  Non raggiungibile  <svg width="24" height="16" viewBox="0 0 24 16"><rect x="2" y="6.5" width="13" height="3" rx="1.5" fill="#000"/><circle cx="19.75" cy="8" r="1.65" fill="none" stroke="#000" stroke-width="1.2"/></svg>
  Spento     <svg width="24" height="16" viewBox="0 0 24 16" opacity=".45"><rect x="2" y="6.5" width="13" height="3" rx="1.5" fill="#000"/></svg>
  Avvio      due immagini alternate: <svg width="24" height="16" viewBox="0 0 24 16"><rect x="2.5" y="7" width="12" height="2" rx="1" fill="none" stroke="#000"/><circle cx="19.75" cy="8" r="1.65" fill="none" stroke="#000" stroke-width="1.2"/></svg> e la stessa senza il cerchio
  Frontale Grafite in cima al pannello, stato Collegato (stesso corpo scuro in entrambi i temi;
  la fessura si riempie con la cache, il LED sta sull'asse della fessura, y=40):
  <svg viewBox="0 0 336 112"><defs><linearGradient id="fx-fd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3835"/><stop offset="1" stop-color="#1c1b19"/></linearGradient></defs><rect x=".5" y=".5" width="335" height="111" rx="12" fill="url(#fx-fd)" stroke="#0f0f0e"/><rect x="1.5" y="1.5" width="333" height="109" rx="11" fill="none" stroke="#fff" stroke-opacity=".08"/><rect x="24" y="34" width="212" height="12" rx="6" fill="#0b0b0a"/><rect x="27" y="37" width="99" height="6" rx="3" fill="#d9d4c8"/><text x="24" y="76" font-family="Schibsted Grotesk" font-weight="800" font-size="15" letter-spacing="-.4" fill="#8f8b83">fluix</text><text x="236" y="76" text-anchor="end" font-family="Departure Mono" font-size="11" fill="#b3aea5">48,2 / 100 GB</text><circle cx="290" cy="40" r="10" fill="#0b0b0a"/><circle cx="290" cy="40" r="5.5" fill="#3fdc6c"/><ellipse cx="290" cy="37.6" rx="2.6" ry="1.4" fill="#fff" opacity=".5"/><text x="290" y="76" text-anchor="middle" font-family="Departure Mono" font-size="10" letter-spacing=".5" fill="#b3aea5">COLLEGATO</text></svg>
  Colori del LED nel frontale scuro: Collegato #3fdc6c, attività #ff6a2e, errore #ff4b33, spento
  #3a3834 senza riflesso.

  Vocabolario dei dettagli (set A, da copiare così com'è negli altri concept):
  - LED in ghiera, l'indicatore di stato. Ghiera: 14x14px, border-radius 50%, sfondo #dcd8ce in
    chiaro e #0f0f0e in scuro; box-shadow inset 0 1px 1.5px rgba(0,0,0,.35), 0 1px 0
    rgba(255,255,255,.55) in chiaro e rgba(255,255,255,.06) in scuro. Lente: 7x7px, centrata,
    border-radius 50%. Spenta: rgba(138,134,125,.35), cioè #8a867d al 35%, senza ombre. Accesa:
    il colore dello stato (--led-ok #2fbf57 / #3fdc6c, --led-dl #ff5b1f / #ff6a2e, --led-err
    #ff3b24 / #ff4b33) con box-shadow inset 0 1px 1px rgba(255,255,255,.55), inset 0 -1px 1px
    rgba(0,0,0,.25). Mai alone esterno, mai blur. Il lampeggio (solo per attività vera) è sulla
    lente: animation 1.1s steps(2, jump-none) infinite, opacity .15 a metà; fermo con
    prefers-reduced-motion. Nei frontali SVG lo stesso LED: ghiera nel colore della fessura,
    lente piena, riflesso bianco al 50% in alto, nessun filtro.
  - Lettura, il testo di stato: font-family Departure Mono, 11.5px, text-transform uppercase,
    letter-spacing .04em, color var(--ink-2) (#625f58 / #a29e95). Il colore sta solo nel LED,
    mai nel testo.
  - Fessura, il segno davanti a voci di elenco e note: 12x4px, border-radius 2px, background
    var(--ink-3) (#706c64 / #8f8b83), box-shadow inset 0 1px 1px rgba(0,0,0,.3); a 10px dal
    testo, centrata sulla prima riga. Nella legenda dello spazio prende la tinta del segmento.
  - Consigliata: la parola "CONSIGLIATA" come lettura, preceduta da un LED in ghiera acceso verde.
  Gli avvisi non hanno sfondi colorati: superficie incassata (--sunken), e se l'avviso è uno
  stato porta il LED in ghiera.
-->
<style>
@font-face { font-family: "Departure Mono"; src: url("https://cdn.jsdelivr.net/gh/rektdeckard/departure-mono@v1.500/public/assets/DepartureMono-Regular.woff2") format("woff2"); font-display: swap; }
:root {
  color-scheme: light;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --f-ui: "Schibsted Grotesk", var(--sans); --f-ro: "Departure Mono", ui-monospace, Menlo, monospace;
  --page: #e6e3dc; --surface: #f4f2ed; --raised: #fbfaf7; --sunken: #ebe8e1; --line: #dcd8cf; --ink: #1d1c1a; --ink-2: #625f58; --ink-3: #706c64;
  --brand: #ff5b1f; --good: #2b9d4b; --bad: #e0402a; --track: #e2ded6; --idle: #c9c5bb;
  --good-text: #1a6c31; --brand-text: #a3370a; --bad-text: #b3311e;
  --face-hi: #fdfcfa; --face-lo: #e9e6df; --face-edge: #d3cfc5; --slot: #2a2927; --slot-fill: #8e897f;
  --led-ok: #2fbf57; --led-dl: #ff5b1f; --led-err: #ff3b24; --led-idle: #cfcbc2;
  --wall: radial-gradient(70% 60% at 15% 20%, #f2c9a8 0, transparent 60%), radial-gradient(60% 60% at 85% 80%, #c9cfc4 0, transparent 60%), linear-gradient(160deg, #ddd5c8, #c8c3b8);
  --pop-shadow: 0 0 0 0.5px rgba(40, 30, 20, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 34px 70px -24px rgba(50, 35, 20, 0.5);
  --win-shadow: 0 0 0 0.5px rgba(40, 30, 20, 0.22), 0 30px 70px -20px rgba(50, 35, 20, 0.45);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface: #1d1c1a; --raised: #262522; --sunken: #161514; --line: #2f2d29; --ink: #efece5; --ink-2: #a29e95; --ink-3: #8f8b83;
  --brand: #ff6a2e; --good: #3cc864; --bad: #ff5a43; --track: #2a2926; --idle: #44423d;
  --good-text: #4fd476; --brand-text: #ff7a42; --bad-text: #ff6e5a;
  --face-hi: #2c2b28; --face-lo: #201f1d; --face-edge: #393733; --slot: #0b0b0a; --slot-fill: #6f6b63;
  --led-ok: #3fdc6c; --led-dl: #ff6a2e; --led-err: #ff4b33; --led-idle: #3a3834;
  --wall: radial-gradient(70% 60% at 15% 20%, #5a3320 0, transparent 60%), radial-gradient(60% 60% at 85% 80%, #24302c 0, transparent 60%), linear-gradient(160deg, #1c1a17, #0e0e0d);
  --pop-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 34px 70px -24px rgba(0, 0, 0, 0.8);
  --win-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.9), 0 30px 70px -20px rgba(0, 0, 0, 0.8);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* Concept chrome, not part of the design */
.switch { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: #111; color: #aaa; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.switch b { color: #eee; font-weight: 500; }
.switch nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 300px; }
.switch a { color: #ddd; text-decoration: none; padding: 5px 9px; border-radius: 6px; background: #262626; }
.switch a:hover { background: #333; }
.switch button { font: inherit; border: 0; padding: 5px 9px; border-radius: 6px; background: #262626; color: #eee; cursor: pointer; }
.choices { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding-top: 6px; border-top: 1px solid #262626; }
.ch { display: inline-flex; align-items: center; gap: 2px; }
.chl { color: #888; margin-right: 4px; }
.choices button { padding: 3px 7px; }
.choices button[aria-pressed="true"] { background: #eee; color: #111; }
.choices .reset { margin-left: auto; background: #3a2a1f; }
body[data-chrome="off"] .switch, body[data-chrome="off"] .cap, body[data-chrome="off"] .group-h p, body[data-chrome="off"] .why { display: none; }

/* Storyboard */
.stage { max-width: 1400px; margin: 0 auto; padding: 32px 28px 80px; }
.group { margin-bottom: 56px; }
.group-h { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 18px; }
.group-h h2 { margin: 0; font: 800 30px/1.1 var(--f-ui); letter-spacing: -0.03em; }
.group-h .num { font: 13px var(--f-ro); color: var(--ink-2); }
.group-h p { margin: 0; flex: 1 1 360px; color: var(--ink-2); max-width: 70ch; }
.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 22px; align-items: start; }
.frame { margin: 0; min-width: 0; }
.cap { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; margin: 0 0 10px; }
.cap .id { font: 12px var(--f-ro); color: var(--ink-2); }
.cap b { font-weight: 700; font-size: 15px; white-space: nowrap; }
.cap span:last-child { flex-basis: 100%; color: var(--ink-2); font-size: 13.5px; }

/* Desktop strip */
.desk { position: relative; border-radius: 16px; background: var(--wall); overflow-x: auto; overflow-y: hidden; padding: 34px 12px 24px; display: flex; justify-content: flex-end; }
.desk.left { justify-content: flex-start; }
.desk.center { justify-content: center; }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font: 13px var(--sans); color: #1d1d1f; background: rgba(246, 246, 248, 0.55); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); white-space: nowrap; min-width: 380px; }
:root[data-theme="dark"] .menubar { color: #f1f1f1; background: rgba(24, 24, 28, 0.5); }
.menubar .l { display: flex; gap: 16px; } .menubar .r { display: flex; gap: 12px; align-items: center; }
.mb-icon { height: 20px; padding: 0 6px; border-radius: 5px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.1); }
:root[data-theme="dark"] .mb-icon { background: rgba(255, 255, 255, 0.18); }
.blink { animation: blink 1.1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: 0.15; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }

/* Panel */
.pop { position: relative; width: 352px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); color: var(--ink); font: 13px/1.45 var(--f-ui); border-radius: 20px; box-shadow: var(--pop-shadow); }
.face { margin: 8px 8px 0; }
.face svg { display: block; width: 100%; height: auto; }
.face.ess { margin: 14px 8px 0; }
.led-ok { fill: var(--led-ok); } .led-dl { fill: var(--led-dl); } .led-err { fill: var(--led-err); } .led-idle { fill: var(--led-idle); }
.status { display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 22px; }
.status h3 { margin: 0; font: 700 20px/1.2 var(--f-ui); letter-spacing: -0.02em; }
.status p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
.status ol { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.meta-line { font: 12px var(--f-ro); color: var(--ink-2); letter-spacing: 0.02em; }
.btns { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; font: 600 14px var(--f-ui); border-radius: 12px; }
.btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn-primary { flex: 1; height: 44px; background: var(--ink); color: var(--surface); }
.btn-ghost { height: 44px; padding: 0 14px; color: var(--ink-2); font-weight: 500; }
.btn-soft { height: 36px; padding: 0 14px; background: var(--sunken); font-size: 13px; }
.btn-small { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn-danger { background: var(--bad-text); color: #fff; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
.notice b { display: block; font-weight: 700; }
.notice.warn, .notice.info, .notice.calm { background: var(--sunken); color: var(--ink); }
.notice .ic { flex-shrink: 0; margin-top: 2px; display: flex; }
.notice .ic .fessura { margin-top: 6px; }
.notice .btn { margin-top: 8px; }
.notice .btn-soft { background: var(--raised); box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12); }
.space { padding: 0 20px 18px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.sec-h b { font: 12px var(--f-ro); letter-spacing: 0.02em; color: var(--ink); text-transform: none; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.legend li { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.legend .sw { width: 12px; height: 4px; border-radius: 2px; flex-shrink: 0; box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.3); }
.legend .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.legend .v { font: 12px var(--f-ro); color: var(--ink); }
.projects { margin: 0 8px; padding: 14px 4px 6px; background: var(--sunken); border-radius: 14px; }
.projects .sec-h { padding: 0 12px; margin-bottom: 4px; color: var(--ink-2); }
.projects.dim { opacity: 0.55; }
.prow { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 4px 0 12px; border-radius: 10px; }
.prow:hover, .prow.open { background: var(--raised); }

function chip(p, o) {
  if (o.state === "dl" && p.id === o.target) return `<span class="chip ${txtCls()} dl">${Math.floor((p.avail / p.size) * 100)}%</span>`;
  if (o.queue && o.queue.includes(p.id)) return `<span class="chip ${txtCls()}">In coda</span>`;
  if (p.avail >= p.size) return `<span class="chip ${txtCls()} ready">Pronto</span>`;
  if (p.avail > 0) return `<span class="chip ${txtCls()}">${Math.round((p.avail / p.size) * 100)}%</span>`;
  return `<span class="chip ${txtCls()}">Online</span>`;

function rowMenu(p, o) {
  const cacheFree = LIMIT - o.used;
  const missing = p.size - p.avail;
  const items = [];
  if (p.size > LIMIT) {
    items.push(`<div class="mnote">Con ${gb(p.size)} è più grande dello spazio di Fluix su questo Mac (${LIMIT} GB). Si apre lo stesso dal Finder: ogni salto nel video aspetta circa un secondo.</div><div class="sep"></div>`);
  } else if (missing > 0) {
    if (missing > cacheFree && (o.fullMode || (C.cache === "blocca" ? "block" : "evict")) === "block") {
      items.push(`<button class="mi" disabled style="opacity:.5">Rendi disponibile<span class="aside">${gb(missing)}</span></button><div class="mnote">Serve spazio: su questo Mac restano ${gb(cacheFree)} per Fluix. Libera prima un progetto che non stai montando.</div>`);
    } else if (missing > cacheFree) {
      items.push(`<button class="mi hl">Rendi disponibile<span class="aside">${eta(missing)}</span></button><div class="mnote">Per fare posto Fluix libererà i file aperti meno di recente su questo Mac. Restano su Fluix e si riscaricano quando li apri.</div>`);
    } else {
      items.push(`<button class="mi hl">Rendi disponibile<span class="aside">${eta(missing)}</span></button>`);
    }

  if (p.avail > 0) items.push(`<button class="mi">Libera spazio<span class="aside">${gb(p.avail)}</span></button>`);
  items.push(`<button class="mi">Mostra nel Finder<span class="aside">${icon("folder", 14)}</span></button>`);

function panel(o) {
  const P = o.projects || BASE;
  o.used = o.used ?? P.reduce((s, p) => s + p.avail, 0) + OTHER;
  const tgt = P.find((p) => p.id === o.target);
  if (tgt) o.pct = Math.floor((tgt.avail / tgt.size) * 100);
  const word = o.word || wordOf();
  let h, p = "", extra = "", btns;
  const prim = (ic, t, dis) => `<button class="btn btn-primary"${dis ? " disabled" : ""}>${icon(ic, 16)}${t}</button>`;
  switch (o.state) {
    case "dl": {
      h = `Download di ${tgt.name}`; p = "Puoi già montare: i file arrivano mentre lavori.";
      const q = (o.queue || []).map((id) => P.find((x) => x.id === id).name);
      extra = `<div class="meta-line">${num(tgt.avail)} di ${gb(tgt.size)} · ${eta(tgt.size - tgt.avail)}</div>${q.length ? `<div class="meta-line">Poi: ${esc(q[0])}${q.length > 1 ? ` e altri ${q.length - 1}` : ""}</div>` : ""}`;
      btns = `<div class="btns">${prim("open", "Apri nel Finder")}<button class="btn btn-ghost">Interrompi</button></div>`; break;
    }
    case "starting":
      h = "Fluix si sta avviando"; p = "Pochi secondi e i progetti tornano nel Finder.";
      btns = `<div class="btns">${prim("open", "Apri nel Finder", true)}</div>`; break;
    case "off":
      h = "Fluix non è raggiungibile";
      if ((o.reconnect || (C.riconn === "pulsante" ? "manual" : "auto")) === "manual") {
        extra = listOf(["Salva il progetto in CapCut.", "Controlla che il Mac sia connesso a internet.", "Premi Riconnetti."]);
        btns = `<div class="btns">${prim("refresh", "Riconnetti")}</div>`;
      } else {
        p = "Riprovo da solo tra <span class=\"meta-line\" data-countdown>24 s</span>. Intanto salva il progetto in CapCut.";
        extra = `<div class="notice calm"><span class="ic"><span class="fessura"></span></span><span>Se non torna, controlla che il Mac sia connesso a internet. I file già aperti restano in CapCut.</span></div>`;
        btns = `<div class="btns">${prim("refresh", "Riprova ora")}</div>`;
      }
      break;
    case "stop":
      h = word === "Espelli" ? "Fluix è espulso" : "Fluix è spento"; p = "Accendilo per ritrovare i progetti nel Finder.";
      btns = `<div class="btns">${prim("power", "Accendi Fluix")}</div>`; break;
    case "revoked":
      h = "Questo Mac non ha più accesso"; p = "Un amministratore di Studio Esempio lo ha rimosso il 16 ottobre. Il disco è scollegato e i file scaricati su questo Mac sono stati cancellati.";
      extra = `<div class="notice calm"><span class="ic"><span class="fessura"></span></span><span>I progetti sono al sicuro su Fluix. Se è un errore, scrivi a chi gestisce il team.</span></div>`;
      btns = `<div class="btns">${prim("refresh", "Accedi di nuovo")}</div>`; break;
    case "low":
      h = "Fluix è collegato"; p = "I progetti sono nel Finder, sotto Fluix.";
      extra = `<div class="notice warn"><span class="ic">${ind("err")}</span><span><b>Il Mac ha quasi finito lo spazio</b>Restano 12 GB liberi. Sotto i 10 GB Fluix libera da solo tutti i file scaricati, per non riempire il disco.<br><button class="btn btn-soft">Libera spazio ora</button></span></div>`;
      btns = `<div class="btns">${prim("open", "Apri nel Finder")}</div>`; break;
    default:
      h = "Fluix è collegato"; p = "I progetti sono nel Finder, sotto Fluix.";
      btns = `<div class="btns">${prim("open", "Apri nel Finder")}</div>`;
  }
  const banner = o.update ? `<div class="banner"><span class="t"><b>Fluix 0.2.0 è pronto.</b> Si installa quando riavvii l'app.</span><button class="btn btn-soft btn-small" style="background:var(--raised)">Riavvia</button></div>` : "";
  const faceState = o.state === "ok" && o.update ? "ok" : o.state;

  const showSpace = ["ok", "dl", "low"].includes(o.state) && !o.hideSpace;
  const parts = P.filter((x) => x.avail > 0).map((x, i) => ({ n: x.name, g: x.avail, c: ["var(--ink)", "var(--ink-2)", "var(--slot-fill)"][i % 3] }));
  parts.push({ n: "Altri file aperti di recente", g: OTHER, c: "var(--idle)" });
  const space = showSpace ? `<section class="space"><div class="sec-h"><span>Su questo Mac</span><b>${num(o.used)} di ${LIMIT} GB</b></div><ul class="legend">${parts.map((x) => `<li><span class="sw" style="background:${x.c}"></span><span class="n">${esc(x.n)}</span><span class="v">${gb(x.g)}</span></li>`).join("")}<li><span class="sw" style="background:var(--track)"></span><span class="n">Ancora libero</span><span class="v">${gb(Math.max(0, LIMIT - o.used))}</span></li></ul></section>` : "";

  const showList = ["ok", "dl", "low", "off"].includes(o.state);
  const rows = P.map((x) => {
    const open = o.menu === x.id;
    const conf = o.confirm === x.id ? `<div class="confirm"><b>Liberare ${gb(x.avail)} di ${esc(x.name)}?</b><p>I file restano nel Finder e su Fluix: si riscaricano quando li apri, e fino ad allora ogni salto nel video aspetta circa un secondo.</p><div class="btns"><button class="btn btn-primary">Libera spazio</button><button class="btn btn-soft">Annulla</button></div></div>` : "";
    return `<div class="prow${open || o.confirm === x.id ? " open" : ""}">${marker(x, o)}<span class="n">${esc(x.name)}</span>${chip(x, o)}<button class="icon-btn" aria-label="Azioni per ${esc(x.name)}" aria-expanded="${open}">${icon("dots", 16)}</button></div>${open ? rowMenu(x, o) : ""}${conf}`;
  }).join("");
  const list = showList ? `<section class="projects${o.state === "off" ? " dim" : ""}"><div class="sec-h"><span>Progetti</span><b>${P.length}</b></div>${rows}</section>` : "";

  const stopConfirm = o.stopConfirm ? `<div class="confirm" style="margin:8px 8px 0"><b>${word === "Espelli" ? "Espellere Fluix?" : "Spegnere Fluix?"}</b><p>${word === "Espelli" ? "Il disco sparisce dal Finder. La macchina virtuale resta accesa." : "Il disco sparisce dal Finder e CapCut non vede più i file finché non lo riaccendi. Si libera anche la memoria che Fluix usa."}</p><div class="btns"><button class="btn btn-primary">${word}</button><button class="btn btn-soft">Annulla</button></div></div>` : "";
  const offIcon = word === "Espelli" ? "eject" : "power";
  const footAction = ["stop", "revoked"].includes(o.state) ? "" : `<button class="btn">${icon(offIcon, 14)}${word}</button>`;
  const foot = `<footer class="foot"><span class="ver">Fluix 0.1.0</span><button class="icon-btn" aria-label="Impostazioni">${icon("gear", 16)}</button>${footAction}</footer>`;

  return `<div class="pop" role="dialog" aria-label="Pannello di Fluix">${banner}${face({ state: faceState, used: o.used, pct: o.pct })}<section class="status"><div><h3>${esc(h)}</h3>${p ? `<p>${p}</p>` : ""}</div>${extra}${btns}</section>${space}${list}${stopConfirm}${foot}</div>`;
}

  const n = (t, b, w) => `<div class="ntf">${appIcon(38)}<div class="tx"><div class="top"><b>${t}</b><span class="when">${w}</span></div><p>${b}</p></div></div>`;

function desk(inner, opts = {}) {
  return `<div class="desk${opts.align ? " " + opts.align : ""}">${opts.bar === false ? "" : `<div class="menubar"><div class="l"><b>CapCut</b><span>File</span><span>Modifica</span><span>Vista</span></div><div class="r"><span class="mb-icon">${mbIcon(opts.mb || "ok")}</span><span>ven 16 ott 10:42</span></div></div>`}${inner}</div>`;
}
function frame(id, title, line, body) {
  return `<figure class="frame" id="${id}"><figcaption class="cap"><span class="id">${id.toUpperCase()}</span><b>${title}</b><span>${line}</span></figcaption>${body}</figure>`;
}
function group(id, n, title, line, inner) {
  return `<section class="group" id="${id}"><header class="group-h"><span class="num">${n}</span><h2>${title}</h2><p>${line}</p></header>${inner}</section>`;
}
function decision(n, title, line, a, b, rec, why) {
  const opt = (k, o) => `<div class="opt"><div class="opt-h"><span class="k">${k}</span><b>${o.t}</b>${rec === k ? recMark() : ""}</div>${o.body}</div>`;
  return `<article class="decision" id="d${n}"><header><span class="num">Decisione ${n}</span><h3>${title}</h3><p>${line}</p></header><div class="opts">${opt("A", a)}${opt("B", b)}</div><p class="why">${why}</p></article>`;
}

// Details decision: four elements, A and B, each in both themes at 1x and 3x
function detailsRows() {
  const rec = '<span class="rec"><span class="led ok"></span><span class="lettura">Consigliata</span></span>';
  const S = (inner) => ["th-light", "th-dark"].map((t) => `<div class="smp ${t}">${inner}</div>`).join("") + ["th-light", "th-dark"].map((t) => `<div class="smp big ${t}"><span class="z">${inner}</span></div>`).join("");
  const opt = (k, name, inner, note, isRec) => `<div class="dt-opt"><div class="opt-h"><span class="k">${k}</span><b>${name}</b>${isRec ? recMark() : ""}</div><div class="sw4">${S(inner)}</div><p>${note}</p></div>`;
  const row = (title, line, a, b) => `<div class="dt"><div class="dt-h"><b>${title}</b><span>${line}</span></div>${a}${b}</div>`;
  return [
    row("1. Indicatore di stato", "Spento, collegato, in attività, errore.",
      opt("A", "LED in ghiera", '<span class="led"></span><span class="led ok"></span><span class="led dl"></span><span class="led err"></span>', "Lo stesso LED del frontale, in piccolo: ghiera incassata da 14 px e lente da 7 px, nessun alone.", true),
      opt("B", "Tacca", '<span class="tacca"></span><span class="tacca ok"></span><span class="tacca dl"></span><span class="tacca err"></span>', "Una barra del VU meter, 3 per 12 px, accesa nel colore dello stato.", false)),
    row("2. Testo di stato", "Pronto, 28%, Online accanto all'indicatore.",
      opt("A", "Lettura", '<span class="led ok"></span><span class="lettura">Pronto</span><span class="lettura">28%</span>', "Departure Mono maiuscolo, inchiostro secondario: il colore sta solo nel LED.", true),
      opt("B", "Targhetta", '<span class="led ok"></span><span class="targhetta">Pronto</span><span class="targhetta">28%</span>', "Le stesse parole su una piastrina incassata, senza colore.", false)),
    row("3. Segno di elenco e di nota", "Davanti ai passi e alle note, al posto dei pallini.",
      opt("A", "Fessura", '<span class="fessura"></span><span>Salva in CapCut</span>', "La fessura del drive in piccolo, 12 per 4 px, con un'ombra interna leggera.", true),
      opt("B", "Numero di passo", '<span class="passo">01</span><span>Salva in CapCut</span>', "Numeri in Departure Mono; ha senso solo dove l'ordine conta.", false)),
    row("4. Il segno Consigliata", "Sulle decisioni di questo concept e degli altri.",
      opt("A", "Lettura con LED", rec, "La parola come lettura, con il LED acceso: la stessa grammatica degli stati.", true),
      opt("B", "Tasto", '<span class="tasto">Consigliata</span>', "Una piastrina che sembra un tasto fisico, senza colore.", false))
  ].join("");
}

  group("icona", "05", "Icone", "L'icona dell'app e l'icona della barra dei menu sono la stessa cosa: fessura e LED sullo stesso asse. Nella barra dei menu è un'immagine template: macOS la colora, lo stato passa dalla forma, il lampeggio sono due immagini alternate.", `<div class="appsizes" id="appsizes">${[128, 32, 16].map((n) => `<figure><div class="ai-wrap">${appIcon(n)}</div><figcaption>${n} px</figcaption></figure>`).join("")}<figure><div class="ai-wrap mb4">${["ok", "dl", "off", "stop", "starting"].map((x) => `<span class="l">${mbIcon(x)}</span>`).join("")}</div><div class="ai-wrap mb4 dk">${["ok", "dl", "off", "stop", "starting"].map((x) => `<span>${mbIcon(x)}</span>`).join("")}</div><figcaption>barra dei menu ingrandita 4 volte: collegato, download, non raggiungibile, spento, avvio</figcaption></figure></div>
  <div class="mbgrid">
    ${[["ok", "Collegato", "fessura e punto pieni"], ["dl", "Download", "il punto lampeggia"], ["starting", "Avvio", "fessura e anello vuoti, l'anello lampeggia"], ["off", "Non raggiungibile", "anello vuoto"], ["stop", "Spento", "solo la fessura, attenuata"]].map(([s, t, d]) => `<div class="mbs"><div class="bars"><div class="bl">${mbIcon(s)}</div><div class="bd">${mbIcon(s)}</div></div><div class="cap2"><b>${t}</b><span>${d}</span></div></div>`).join("")}
  </div>`),
  group("decisioni", "06", "Decisioni aperte", "Quattro scelte che cambiano il prodotto. Per ognuna la mia raccomandazione e perché.", `
    ${decision(1, "Spegni o Espelli", "La parola dell'azione nel piede del pannello e nella sua conferma.",
      { t: "Spegni", body: desk(panel({ state: "ok", stopConfirm: true, hideSpace: true, word: "Spegni" }), { align: "center" }) },
      { t: "Espelli", body: desk(panel({ state: "ok", stopConfirm: true, hideSpace: true, word: "Espelli" }), { align: "center" }) },
      "A", "Spegni: ferma anche la macchina virtuale e fa coppia con Accendi. In macOS Espelli vuol dire solo smontare, e chi lo usa si aspetta che il disco non torni; il nostro agente invece lo rimonterebbe.")}
    ${decision(2, "Cache piena", "Tre progetti già sul Mac occupano 97,4 GB; si chiede Rendi disponibile su Showreel 2026, 11,4 GB.",
      { t: "Blocca con Serve spazio", body: desk(panel({ state: "ok", projects: FULL, menu: "showreel", hideSpace: true, fullMode: "block" }), { align: "center" }) },
      { t: "Libera i meno recenti", body: desk(panel({ state: "ok", projects: FULL, menu: "showreel", hideSpace: true, fullMode: "evict" }), { align: "center" }) },
      "B", "Libera i meno recenti: JuiceFS lo fa già quando la cache arriva al limite, e i blocchi che escono sono per definizione quelli che nessuno sta usando. Bloccare chiede a chi monta di decidere cosa liberare, cosa che il sistema sa meglio.")}
    ${decision(3, "Riconnessione", "Cosa vede chi ha perso la rete mentre lavora.",
      { t: "Automatica ogni 30 secondi", body: desk(panel({ state: "off", reconnect: "auto" }), { align: "center", mb: "off" }) },
      { t: "Solo il pulsante Riconnetti", body: desk(panel({ state: "off", reconnect: "manual" }), { align: "center", mb: "off" }) },
      "A", "Automatica: chi monta non deve fare niente e il pulsante resta per riprovare subito. Mentre l'app è aperta riprova ogni 30 secondi; l'agente di sistema resta il paracadute ogni 2 minuti.")}
    ${decision(4, "Dove stanno le impostazioni", "Si aprono di rado: account, spazio, avvio al login, diagnostica.",
      { t: "Finestra separata", body: desk(`<div class="scaled" data-scale=".62" style="width:${Math.round(620 * 0.62)}px;flex-shrink:0"><div style="width:620px;transform:scale(.62);transform-origin:top left">${settingsWindow(false)}</div></div>`, { align: "center" }) },
      { t: "Seconda pagina del pannello", body: desk(settingsPage(), { align: "center" }) },
      "A", "Finestra separata: è la convenzione del Mac (Cmd+virgola), c'è spazio per spiegare spazio e diagnostica, e il pannello resta a una cosa sola. La pagina nel pannello costringe a frasi da una riga proprio dove servono spiegazioni.")}
  `)
].join("");
}

function render() {
  document.getElementById("stage").innerHTML = build();
  // Scaled previews keep their real layout and take only the scaled height
  document.querySelectorAll("[data-scale]").forEach((o) => { o.style.height = Math.ceil(o.firstElementChild.offsetHeight * Number(o.dataset.scale)) + "px"; });
  // Interactions that the frames promise
  document.querySelectorAll(".toggle").forEach((t) => t.addEventListener("click", () => t.setAttribute("aria-checked", String(t.getAttribute("aria-checked") !== "true"))));
  document.querySelectorAll("[data-cap-range]").forEach((r) => r.addEventListener("input", () => { r.closest(".well").querySelector("[data-cap]").textContent = r.value + " GB"; }));
  document.querySelectorAll("[data-send]").forEach((b) => b.addEventListener("click", () => { b.closest(".win").outerHTML = settingsWindow(true); }));
  document.querySelectorAll("#choices [data-k]").forEach((b) => b.setAttribute("aria-pressed", String(C[b.dataset.k] === b.dataset.v)));
}

let left = 24;
setInterval(() => { left = left <= 1 ? 30 : left - 1; document.querySelectorAll("[data-countdown]").forEach((e) => (e.textContent = left + " s")); }, 1000);

// Concept chrome, from the mockup template
const KEY = `concept:${location.pathname}`;
const root = document.documentElement, body = document.body;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
const setTheme = (t) => { root.dataset.theme = t; save({ ...load(), theme: t }); };
document.querySelector("[data-theme-toggle]").addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));
document.querySelector("[data-chrome-toggle]").addEventListener("click", () => (body.dataset.chrome = "off"));
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
  const k = e.key.toLowerCase();
  if (k === "t") setTheme(root.dataset.theme === "dark" ? "light" : "dark");
  else if (k === "p") body.dataset.chrome = body.dataset.chrome === "off" ? "on" : "off";
});
root.dataset.theme = load().theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

const valid = (k, v) => CONTROLS.some(([key, , opts]) => key === k && opts.some(([val]) => val === v));
const writeChoices = () => {
  history.replaceState(null, "", location.pathname + location.search + "#" + new URLSearchParams(C).toString());
  save({ ...load(), choices: C });
};
const readChoices = () => {
  const out = { ...DEF };
  const stored = load().choices || {};
  Object.keys(DEF).forEach((k) => { if (valid(k, stored[k])) out[k] = stored[k]; });
  const h = new URLSearchParams(location.hash.slice(1));
  Object.keys(DEF).forEach((k) => { if (valid(k, h.get(k))) out[k] = h.get(k); });
  return out;
};
document.getElementById("choices").innerHTML = CONTROLS.map(([k, label, opts]) => `<span class="ch" role="group" aria-label="${label}"><span class="chl">${label}</span>${opts.map(([v, t]) => `<button data-k="${k}" data-v="${v}" aria-pressed="false">${t}</button>`).join("")}</span>`).join("") + '<button class="reset" data-reset>Ripristina consigliate</button>';
document.getElementById("choices").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.reset != null) C = { ...DEF };
  else C = { ...C, [b.dataset.k]: b.dataset.v };
  writeChoices();
  render();
});
document.querySelector(".switch nav").addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  const t = document.getElementById(a.getAttribute("href").slice(1));
  if (t) scrollTo({ top: t.getBoundingClientRect().top + scrollY - document.querySelector(".switch").offsetHeight - 12 });
});
C = readChoices();
writeChoices();
render();
</script>
</body>
</html>
