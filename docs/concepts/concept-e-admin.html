<title>Concept E - web del control plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  Concept E: com'è fatto il sito del control plane, dove un admin gestisce persone, Mac, dischi e
  la chiave dell'archivio. Storyboard di tutte le schermate, nello stile D Drive (concept-b-identity).
  Tasti: t tema, p nasconde barra, indice e selettori di stato per guardare pulito.
  Deviazione voluta dal template: non è un file a varianti su una decisione sola, è il giro completo
  delle schermate; le decisioni aperte stanno in fondo come blocchi A/B con la raccomandazione.

  Il problema: con PostgreSQL condiviso e il login, qualcuno deve invitare le persone, vedere quali Mac
  hanno accesso, revocarne uno e cambiare la chiave S3 dopo una revoca. Oggi non esiste niente: le
  chiavi stanno in uno zip e "togliere l'accesso" vuol dire ruotare a mano su ogni Mac.

  Schermate:
  1  Accesso: email, link inviato, link scaduto.
  2  Panoramica: i dischi, i Mac collegati adesso, lo stato dei servizi visto dal control plane,
     l'attività recente, il promemoria della chiave da cambiare.
  3  Persone: tabella, invito, cambio di ruolo, rimozione con conferma, stato dopo la rimozione.
  4  Mac: tabella, revoca di un Mac, riga revocata, stato vuoto.
  5  Cambio della chiave S3: quattro passi guidati, la finestra di rischio con il tempo che scorre,
     errore della scrittura di prova.
  6  Dischi: elenco, dettaglio, nuovo disco.
  7  Registro: filtri, caricamento.
  8  Impostazioni dell'organizzazione: nome, SMTP per i link, archivio S3 con prova fallita, chi invita.

  Mappatura sul codice (fattibilità, non piano): FastAPI + React + PostgreSQL, il modello dati di
  docs/architecture.html. Persone = users + memberships (admin | member, invited | active | revoked);
  Mac = devices, un ruolo PostgreSQL fluix_d_<id> per Mac; Dischi = volumes, uno per database dei
  metadata; Registro = audit_events; Accesso = sign_in_requests con magic link. Revocare un Mac è
  REVOKE + pg_terminate_backend + DROP ROLE; rimuovere una persona lo fa per tutti i suoi Mac.
  Il cambio della chiave: il control plane prova una scrittura con la chiave nuova, poi esegue
  juicefs config su ogni volume; i Mac montati la leggono dai metadata entro un minuto (da verificare
  nello spike). Creare e cancellare la chiave dal provider resta un passo manuale: niente API del
  provider nel core.
  Cosa il control plane non fa: non legge né scrive i file, non sta sul percorso dei dati. Se il sito
  si ferma, i dischi montati continuano a funzionare; si fermano accessi nuovi, inviti, revoche.
  "Mac collegati adesso" e "ultimo contatto" vengono dall'heartbeat dell'app; lo stato di PostgreSQL
  e S3 è quello che vede il control plane, non quello che vede ogni Mac.

  Dati: organizzazione "Studio Esempio", persone, Mac, date e misure inventati e plausibili; dominio
  studio.example. Le dimensioni dei dischi sono di fantasia, i 4 MB di blocco e i 7 giorni di cestino
  sono la configurazione vera (docs/ARCHITECTURE.md).

  Decisioni aperte, con raccomandazione:
  D2 dopo la rimozione di una persona: rotazione che parte da sola, o promemoria fisso con il bottone
     "Cambia chiave adesso" nella conferma (consigliato).
  D3 cosa vede un membro: Persone e Mac in sola lettura, o solo "I miei Mac" con la revoca del proprio
     Mac perso (consigliato).

  Giro 2: "troppi badge, sono AI slop", "le card di altezze diverse in colonna non vanno", "solo barra
  laterale". Tolte tutte le pill: uno stato si dice con il LED e testo semplice nel colore del testo,
  mai con un'etichetta tinta, e niente che ripeta il titolo o il LED. Panoramica riorganizzata a righe:
  dischi, servizi su una riga intera, poi Mac collegati e attività con la stessa altezza e contenuto
  pari. Tolto il pallino sulla voce "Chiave dell'archivio": il promemoria vive in Panoramica.
  D1 chiusa: barra laterale. Tolti l'alternativa con le schede in alto e il suo selettore.
  Giro 3: "i pallini colorati che brillano sono slop come le pill, ma i dettagli mi piacciono".
  Ogni dettaglio generico passa al vocabolario di concept-c-app, CSS copiato così com'è: LED in
  ghiera per ogni stato (anche nei frontali SVG, senza alone), lettura in Departure Mono per il
  testo di stato, mai testo colorato, fessura davanti a elenchi e note, avvisi ed errori su fondo
  incassato neutro, "Consigliata" come LED verde più lettura. Il segno sulla voce "Chiave
  dell'archivio" torna come LED in ghiera acceso arancione finché la finestra è aperta. Tolto
  l'alone dal puntino della i nel logo.
  Giro 4: scelti frontale Grafite e icone Essenziale (marchio definitivo in concept-c-app, copiato
  così com'è). I frontali dei dischi in Panoramica e Dischi sono Grafite: corpo scuro in entrambi i
  temi, fessura riempita #d9d4c8, LED sull'asse della fessura con i colori del frontale scuro. Il
  marchio nella barra laterale e nell'accesso è la fessura con il LED dell'icona della barra dei
  menu, a colori, seguita da "fluix"; l'icona dell'app compare dove si parla di installare l'app
  (invito, accesso). Vocabolario dei dettagli invariato.
  Scelta (17/10/2026): le consigliate. Solo barra laterale; dopo la rimozione di una persona un
  promemoria fisso con "Cambia chiave adesso"; un membro vede solo "I miei Mac" e può revocarne uno.
-->
<style>
@font-face { font-family: "Departure Mono"; src: url("https://cdn.jsdelivr.net/gh/rektdeckard/departure-mono@v1.500/public/assets/DepartureMono-Regular.woff2") format("woff2"); font-display: swap; }
:root {
  color-scheme: light;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --f-ui: "Schibsted Grotesk", var(--sans); --f-head: "Schibsted Grotesk", var(--sans); --f-ro: "Departure Mono", var(--mono);
  --page: #e6e3dc; --surface: #f4f2ed; --raised: #fbfaf7; --sunken: #ebe8e1; --line: #dcd8cf; --ink: #1d1c1a; --ink-2: #625f58; --ink-3: #706c64;
  --brand: #ff5b1f; --on-brand: #1d1c1a; --good: #2b9d4b; --bad: #e0402a; --track: #e2ded6; --idle: #c9c5bb;
  --face-hi: #fdfcfa; --face-lo: #e9e6df; --face-edge: #d3cfc5; --slot: #2a2927; --slot-fill: #8e897f;
  --led-ok: #2fbf57; --led-dl: #ff5b1f; --led-err: #ff3b24; --led-idle: #cfcbc2;
  --danger: #b8301f; --on-danger: #ffffff;
  --scrim: rgba(29, 28, 26, 0.36);
  --pop: 0 0 0 0.5px rgba(40, 30, 20, 0.16), 0 30px 70px -26px rgba(50, 35, 20, 0.5);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface: #1d1c1a; --raised: #262522; --sunken: #161514; --line: #2f2d29; --ink: #efece5; --ink-2: #a29e95; --ink-3: #8f8b83;
  --brand: #ff6a2e; --good: #3cc864; --bad: #ff5a43; --track: #2a2926; --idle: #44423d;
  --face-hi: #2c2b28; --face-lo: #201f1d; --face-edge: #393733; --slot: #0b0b0a; --slot-fill: #6f6b63;
  --led-ok: #3fdc6c; --led-dl: #ff6a2e; --led-err: #ff4b33; --led-idle: #3a3834;
  --danger: #ff5a43; --on-danger: #1d1c1a;
  --scrim: rgba(0, 0, 0, 0.55);
  --pop: 0 0 0 0.5px rgba(0, 0, 0, 0.8), 0 30px 70px -26px rgba(0, 0, 0, 0.85);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
.ro { font-family: var(--f-ro); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }

/* Concept chrome, not part of the design */
.switch { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: #111; color: #aaa; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.switch b { color: #eee; font-weight: 500; }
.switch button { font: inherit; border: 0; padding: 5px 9px; border-radius: 6px; background: #262626; color: #eee; cursor: pointer; }
.switch p { margin: 0 0 0 8px; flex: 1 1 240px; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; font: 12px var(--mono); color: var(--ink-2); }
.seg button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); }
body[data-chrome="off"] .switch, body[data-chrome="off"] .index, body[data-chrome="off"] .seg, body[data-chrome="off"] .scr-note { display: none; }

/* Board */
.board { max-width: 1440px; margin: 0 auto; padding: 28px 28px 80px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; }
body[data-chrome="off"] .board { grid-template-columns: minmax(0, 1fr); }
.index { position: sticky; top: 60px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.index .wm { margin: 0 0 18px 10px; }
.index a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
.index a:hover { background: var(--surface); color: var(--ink); }
.index a.on { background: var(--surface); color: var(--ink); font-weight: 600; }
.index small { margin: 14px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.scr { padding-bottom: 56px; }
.scr > h2 { margin: 0 0 6px; font: 700 24px/1.2 var(--f-head); letter-spacing: -0.02em; }
.scr-note { margin: 0 0 14px; max-width: 78ch; color: var(--ink-2); font-size: 14.5px; }

/* Browser frame */
.frame { border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: var(--pop); }
.fbar { height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--sunken); }
.dots { display: flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
.url { flex: 1; max-width: 520px; margin: 0 auto; height: 26px; border-radius: 8px; background: var(--raised); color: var(--ink-2); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.viewport { overflow-x: auto; }
.canvas { min-width: 1080px; position: relative; }

/* App shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 640px; }
.side { background: var(--sunken); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.side .wm { margin: 2px 8px 18px; }
.org { margin: 0 8px 14px; padding: 10px 12px; border-radius: 12px; background: var(--raised); display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
.org span { font-weight: 400; color: var(--ink-3); font-size: 12px; display: block; }
.nav { display: flex; align-items: center; gap: 11px; padding: 0 10px; height: 38px; border-radius: 10px; color: var(--ink-2); font-size: 14px; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }
.nav:hover { color: var(--ink); background: color-mix(in srgb, var(--raised) 60%, transparent); }
.nav.on { background: var(--raised); color: var(--ink); font-weight: 600; }
.nav .cnt { margin-left: auto; font: 12px var(--f-ro); color: var(--ink-3); }
.nav .led { margin-left: auto; }
.me { margin-top: auto; padding: 12px 10px 0; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.me .av { width: 30px; height: 30px; background: var(--raised); color: var(--ink-2); }
.me span { color: var(--ink-3); display: block; font-size: 12px; }
.main { padding: 28px 34px 40px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 22px; }
.ph h1 { margin: 0; font: 700 28px/1.15 var(--f-head); letter-spacing: -0.025em; }
.ph p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
.ph .acts { display: flex; gap: 8px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 11px; border: 0; cursor: pointer; font: 600 14px var(--f-ui); white-space: nowrap; }
.btn-ink { background: var(--ink); color: var(--surface); }
.btn-soft { background: var(--sunken); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink-2); font-weight: 500; }
.btn-danger { background: var(--danger); color: var(--on-danger); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--sunken); color: var(--ink); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 13px; color: var(--ink-2); }
.input { height: 42px; border-radius: 11px; border: 0; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); padding: 0 14px; font-size: 14.5px; width: 100%; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
.input.ro { font-size: 13.5px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 12px; border: 0; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
.opt b { display: block; font-size: 14px; margin-bottom: 2px; }
.opt span { font-size: 13px; color: var(--ink-2); }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }

/* Details vocabulary, set A (copied verbatim from concept-c-app.html) */
:root { --bezel: #dcd8ce; --bezel-hl: rgba(255, 255, 255, 0.55); --lens-off: rgba(138, 134, 125, 0.35); }
:root[data-theme="dark"] { --bezel: #0f0f0e; --bezel-hl: rgba(255, 255, 255, 0.06); }
@keyframes blink { 50% { opacity: 0.15; } }
.led { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; display: inline-grid; place-items: center; vertical-align: middle; background: var(--bezel); box-shadow: inset 0 1px 1.5px rgba(0, 0, 0, 0.35), 0 1px 0 var(--bezel-hl); }
.led::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lens-off); }
.led.ok::after, .led.dl::after, .led.err::after { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.55), inset 0 -1px 1px rgba(0, 0, 0, 0.25); }
.led.ok::after { background: var(--led-ok); } .led.dl::after { background: var(--led-dl); } .led.err::after { background: var(--led-err); }
.led.blinking::after { animation: blink 1.1s steps(2, jump-none) infinite; }
@media (prefers-reduced-motion: reduce) { .led.blinking::after { animation: none; } }
.lettura { font: 11.5px var(--f-ro); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
.fessura { display: inline-block; width: 12px; height: 4px; border-radius: 2px; flex-shrink: 0; background: var(--ink-3); box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.3); }
.mk { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; color: var(--ink-2); font-size: 13.5px; }
.mk li { display: flex; gap: 10px; align-items: baseline; }
.mk li .fessura { transform: translateY(-2px); }
/* A state: LED in ghiera followed by its lettura */
.st { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; }
.note { display: flex; gap: 10px; align-items: baseline; }
.note .fessura { transform: translateY(-2px); }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-size: 13px; font-weight: 700; background: var(--sunken); color: var(--ink-2); }

/* Tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 0 14px 10px; white-space: nowrap; }
.tbl td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tr.dim td { color: var(--ink-3); }
.tbl tr:hover td { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who b { font-weight: 600; display: block; }
.who span { color: var(--ink-3); font-size: 13px; }
.who .av { color: var(--ink-2); font-size: 13px; }
.role { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-size: 14px; }
.role:hover { background: var(--sunken); }
.r { text-align: right; }
.well { background: var(--raised); border-radius: 16px; padding: 18px 20px; }
.well h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 .well { display: flex; flex-direction: column; }
.grid3 .macs, .grid3 .feed { flex: 1; align-content: space-between; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; }

/* Overview */
.disk { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 18px; align-items: center; }
.disk h4 { margin: 0; font: 700 18px var(--f-head); letter-spacing: -0.015em; display: flex; align-items: center; gap: 10px; }
.disk .nums { display: flex; gap: 22px; margin-top: 10px; }
.disk .nums div { font-size: 12.5px; color: var(--ink-2); }
.disk .nums b { display: block; font: 20px var(--f-ro); color: var(--ink); font-weight: 400; white-space: nowrap; }
.disk .nums div { white-space: nowrap; }
.svcs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; }
.svc { display: grid; gap: 4px; font-size: 14px; align-content: start; }
.svc > span:last-child { color: var(--ink-2); font-size: 13.5px; }
.macs { display: grid; gap: 13px; font-size: 14px; }
.macs div { display: flex; align-items: center; gap: 10px; }
.macs em { margin-left: auto; font-style: normal; font: 12px var(--f-ro); color: var(--ink-2); }
.feed { display: grid; gap: 0; font-size: 14px; }
.feed div { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.feed div:first-child { border-top: 0; padding-top: 0; }
.feed time { font: 12px var(--f-ro); color: var(--ink-2); padding-top: 2px; }
.notice { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 14px; background: var(--sunken); margin-bottom: 14px; font-size: 14px; }
.notice p { margin: 0; flex: 1; white-space: normal; }
.notice .timer { font: 13px var(--f-ro); color: var(--ink-2); white-space: nowrap; }
.offpath { font-size: 13.5px; color: var(--ink-2); margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--sunken); }

/* Dialog inside a frame */
.scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 24px; }
.dlg { width: 480px; background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--pop); display: grid; gap: 16px; }
.dlg h3 { margin: 0; font: 700 21px/1.2 var(--f-head); letter-spacing: -0.02em; }
.dlg p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.dlg ul.mk { margin: 0; color: var(--ink-2); font-size: 14.5px; gap: 8px; }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; }

/* Steps (key rotation) */
.steps { display: grid; gap: 10px; max-width: 760px; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--raised); }
.step.todo { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 13px var(--f-ro); background: var(--sunken); color: var(--ink-2); }
.step.done .n { background: var(--sunken); color: var(--ink); }
.step.cur .n { background: var(--ink); color: var(--surface); }
.step h4 { margin: 4px 0 4px; font-size: 16px; }
.step p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 64ch; }
.step .body { display: grid; gap: 14px; margin-top: 10px; }
.progress { display: grid; gap: 8px; font-size: 14px; }
.progress div { display: flex; align-items: center; gap: 10px; }
.progress .ro { margin-left: auto; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
.risk { display: grid; gap: 8px; padding: 16px 18px; border-radius: 16px; background: var(--sunken); margin-bottom: 16px; max-width: 760px; }
.risk .head { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; }

.risk .clock { font: 15px var(--f-ro); color: var(--ink); }
.risk p { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 66ch; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }
.errbox { padding: 14px 16px; border-radius: 12px; background: var(--sunken); font-size: 14px; display: grid; gap: 6px; }
.errbox > span:not(.st) { color: var(--ink-2); }
.errbox .st { margin-bottom: 2px; }
.errbox code { font: 12.5px var(--f-ro); color: var(--ink-2); }

/* Volumes */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.tbl tr.sel td { background: var(--raised); }

/* Audit */
.filters { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.chips { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--sunken); }
.chips button { height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.search { position: relative; } .search svg { position: absolute; left: 12px; top: 13px; color: var(--ink-3); }
.search .input { padding-left: 36px; width: 240px; height: 42px; }
.sk { display: block; height: 12px; border-radius: 6px; background: var(--sunken); animation: sk 1.4s ease-in-out infinite; }
@keyframes sk { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* Settings */
.form { display: grid; gap: 30px; max-width: 720px; }
.form section { display: grid; gap: 14px; padding-top: 22px; border-top: 1px solid var(--line); }
.form section:first-child { border-top: 0; padding-top: 0; }
.form h3 { margin: 0; font-size: 16px; }
.form .sub { margin: -8px 0 0; color: var(--ink-2); font-size: 14px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Empty state */
.empty { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 70px 20px; }
.empty h3 { margin: 0; font: 700 20px var(--f-head); }
.empty p { margin: 0; color: var(--ink-2); max-width: 44ch; font-size: 14.5px; }

/* Sign-in */
.signin { min-height: 640px; display: grid; place-items: center; background: var(--page); padding: 40px; }
.signin .card { width: 420px; background: var(--surface); border-radius: 22px; padding: 32px; box-shadow: var(--pop); display: grid; gap: 20px; }
.signin h1 { margin: 0; font: 700 26px/1.15 var(--f-head); letter-spacing: -0.025em; }
.signin p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.signin .foot { font-size: 13px; color: var(--ink-2); }

/* Wordmark */
.wm { display: inline-flex; align-items: center; gap: 9px; font: 800 21px/1 var(--f-head); letter-spacing: -0.035em; color: var(--ink); }
.wm svg { width: 1.5em; height: 1em; flex-shrink: 0; }
.appline { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); }
.appline svg { width: 40px; height: 40px; flex-shrink: 0; }

/* Decisions */
.dec { display: grid; gap: 22px; }
.dec article { display: grid; gap: 12px; }
.dec h3 { margin: 0; font: 700 19px var(--f-head); letter-spacing: -0.015em; }
.ab { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ab > div { background: var(--surface); border-radius: 16px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.ab .tag { font: 12px var(--f-ro); color: var(--ink-2); }
.ab b { font-size: 15px; }
.ab p { margin: 0; font-size: 14px; color: var(--ink-2); }
.ab .rec { display: inline-flex; align-items: center; gap: 7px; }

@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); padding: 18px 16px 60px; gap: 18px; }
  .index { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .index .wm, .index small { display: none; }
  .index a { white-space: nowrap; }
  .ab { grid-template-columns: minmax(0, 1fr); }
}

  if (s === "rimuovi") overlay = dlg("Rimuovere Marco Bassi?", `<ul class="mk"><li><span class="fessura"></span><span>Perde l'accesso subito: cancelliamo l'accesso al database del suo Mac, <b style="color:var(--ink)">MacBook Air di Marco</b>, e lì il disco smette di rispondere.</span></li>

/* 4. Mac */

/* 5. Chiave */
function chiave() {
  const s = S.chiave;
  const closed = s === "chiusa";
  const risk = closed
    ? `<div class="risk"><div class="head">${stx("ok", "Finestra chiusa")}</div><p>La chiave vecchia non esiste più. Ultimo cambio oggi alle 12:56, dopo la rimozione di Paolo Greco.</p></div>`
    : `<div class="risk"><div class="head">${stx("dl", "Finestra aperta")}<span class="clock">da ${timer()}</span></div><p>Paolo Greco non ha più accesso al disco, ma la chiave dell'archivio è quella di prima. Chi l'avesse copiata può ancora scaricare o cancellare pezzi di file dal bucket, senza nomi né cartelle. Si chiude cambiando chiave.</p></div>`;
  const st = (k) => {
    const order = ["crea", "incolla", "applica", "cancella"];
    const cur = closed ? 4 : s === "errore" ? 1 : s === "incolla" ? 1 : s === "applica" ? 2 : 3;
    const i = order.indexOf(k);
    return i < cur ? "done" : i === cur ? "cur" : "todo";
  };
  const n = (k, i) => `<span class="n">${st(k) === "done" ? ic("check", 15) : i}</span>`;
  const paste = s === "incolla" || s === "errore"
    ? `<div class="body"><div class="cols"><div class="field"><label>Access key</label><input class="input ro" value="EXAMPLE7Q2K9W3ZT0HVA"></div><div class="field"><label>Secret key</label><input class="input ro" type="password" value="xxxxxxxxxxxxxxxxxxxxxxxx"></div></div>
      ${s === "errore" ? `<div class="errbox">${stx("err", "Scrittura di prova fallita")}<span>Il bucket ha rifiutato la chiave nuova. Controlla che abbia il permesso di scrivere su <b>studio-esempio-fluix</b>; nella console va assegnata al bucket, non solo creata.</span><code>AccessDenied · PUT /fluix-probe-7f3a</code></div>` : ""}
      <div><button class="btn btn-ink" data-go="chiave:applica">Prova e applica</button></div></div>` : "";
  const prog = s === "applica" ? `<div class="body progress">
      <div><span class="led ${run > 0 ? "ok" : "dl blinking"}"></span>Scrittura di prova con la chiave nuova<span class="ro">${run > 0 ? "ok" : "..."}</span></div>
      <div><span class="led ${run > 1 ? "ok" : run === 1 ? "dl blinking" : ""}"></span>Disco Progetti aggiornato<span class="ro">${run > 1 ? "ok" : ""}</span></div>
      <div><span class="led ${run > 2 ? "ok" : run === 2 ? "dl blinking" : ""}"></span>Disco Archivio 2025 aggiornato<span class="ro">${run > 2 ? "ok" : ""}</span></div>
      <div><span class="led ${run > 3 ? "ok" : run === 3 ? "dl blinking" : ""}"></span>Mac collegati con la chiave nuova<span class="ro">${run > 3 ? "3 di 3" : run === 3 ? "1 di 3" : ""}</span></div></div>` : "";
  const del = s === "cancella" ? `<div class="body"><label class="check"><input type="checkbox" data-go="chiave:chiusa">Ho cancellato la chiave vecchia (finisce per <span class="ro">...ZT0QK</span>)</label></div>` : "";
  const body = `${ph("Chiave dell'archivio", "Cambiala dopo ogni rimozione o revoca: è l'ultima cosa che un ex membro potrebbe avere")}${risk}
    <div class="steps">
      <div class="step ${st("crea")}">${n("crea", 1)}<div><h4>Crea una chiave nuova nel provider</h4><p>Nella console del tuo provider S3 crea una chiave con permesso di lettura e scrittura sul bucket <b>studio-esempio-fluix</b>. Fluix non lo fa da solo: non usa le API del provider.</p></div></div>
      <div class="step ${st("incolla")}">${n("incolla", 2)}<div><h4>Incollala qui</h4><p>La proviamo con una scrittura nel bucket prima di usarla.</p>${paste}</div></div>
      <div class="step ${st("applica")}">${n("applica", 3)}<div><h4>Fluix la passa ai dischi</h4><p>Aggiorniamo ogni disco; i Mac collegati la prendono da soli entro un minuto, senza fermarsi.</p>${prog}</div></div>
      <div class="step ${st("cancella")}">${n("cancella", 4)}<div><h4>Cancella la chiave vecchia nel provider</h4><p>Finché esiste, la finestra resta aperta. È l'unico passo che chiude davvero.</p>${del}</div></div>
    </div>`;
  return frame("/chiave", shell("chiave", body, "", !closed));
}

/* Decisions */
function decisioni() {
  const rec = '<span class="rec"><span class="led ok"></span><span class="lettura">Consigliata</span></span>';
  return `<div class="dec">
    <article><h3>D2 · Dopo la rimozione di una persona</h3><div class="ab">

      <div><span class="tag">B</span><b>Promemoria fisso, bottone nella conferma</b><p>Dopo la rimozione: "Cambia chiave adesso" in primo piano. Se rimandi, il promemoria resta in cima alla Panoramica con il tempo che scorre, finché la chiave vecchia non è cancellata.</p>${rec}</div></div></article>
    <article><h3>D3 · Cosa vede un membro</h3><div class="ab">
      <div><span class="tag">A</span><b>Persone e Mac in sola lettura</b><p>Trasparenza: tutti vedono chi ha accesso. Ma mostra email e Mac di tutti a chi non deve agire, e aggiunge sezioni che un membro non userà.</p></div>

  </div>`;
}
const SCREENS = [
  ["accesso", "Accesso", "Email e link, senza password. Il link vale 15 minuti e una volta sola; la pagina aspetta e si aggiorna da sola.", [["form", "Modulo"], ["inviato", "Link inviato"], ["scaduto", "Link scaduto"]], accesso],
  ["panoramica", "Panoramica", "Quello che un admin guarda aprendo il sito: i dischi, chi è collegato, se i servizi rispondono, cosa è successo. Lo stato dei servizi è quello visto dal control plane.", [["promemoria", "Con promemoria della chiave"], ["normale", "Normale"]], panoramica],
  ["persone", "Persone", "Invito, ruolo, rimozione. La conferma dice in parole semplici cosa succede ai Mac di quella persona e cosa resta aperto.", [["tabella", "Tabella"], ["invita", "Invito"], ["rimuovi", "Rimozione"], ["dopo", "Dopo la rimozione"]], persone],
  ["mac", "Mac", "Un accesso al database per Mac: un portatile perso si revoca da solo. Il LED è l'ultimo contatto dell'app; la riga revocata resta per memoria.", [["tabella", "Tabella"], ["revoca", "Revoca"], ["vuoto", "Vuoto"]], mac],
  ["chiave", "Cambio della chiave", "La finestra di rischio dopo una rimozione, in quattro passi. Il passo 3 si anima: premi Prova e applica.", [["incolla", "Passo 2"], ["errore", "Prova fallita"], ["applica", "Applicazione"], ["cancella", "Passo 4"], ["chiusa", "Finestra chiusa"]], chiave],
  ["dischi", "Dischi", "Un disco è un volume con il suo database dei metadata. Il nome non si cambia: CapCut ricorda i file per percorso.", [["elenco", "Elenco e dettaglio"], ["nuovo", "Nuovo disco"]], dischi],
  ["registro", "Registro", "Gli eventi del registro di controllo, con filtri. Lo stato di caricamento usa righe segnaposto, non uno spinner.", [["dati", "Con dati"], ["caricamento", "Caricamento"]], registro],
  ["impostazioni", "Impostazioni", "Nome, email per i link, archivio S3 con la prova di scrittura, chi può invitare.", [["errore", "Prova S3 fallita"], ["ok", "Prova riuscita"]], impostazioni]
];

function renderScreen(id) {
  const sc = SCREENS.find((x) => x[0] === id);
  const el = document.querySelector(`#s-${id} .stage`);
  el.innerHTML = sc[4]();
  document.querySelectorAll(`#s-${id} .seg button`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.state === S[id])));
}
function build() {
  const main = document.getElementById("screens");
  main.innerHTML = SCREENS.map(([id, t, note, states]) => `<section class="scr" id="s-${id}"><h2>${t}</h2><p class="scr-note">${note}</p>
    <div class="seg"><span>stato:</span>${states.map(([k, l]) => `<button data-screen="${id}" data-state="${k}" aria-pressed="false">${l}</button>`).join("")}</div><div class="stage"></div></section>`).join("")
    + `<section class="scr" id="s-decisioni"><h2>Decisioni aperte</h2><p class="scr-note">Due scelte che cambiano il comportamento, con la mia raccomandazione. La navigazione è chiusa: barra laterale.</p><div id="decBody"></div></section>`;
  SCREENS.forEach(([id]) => renderScreen(id));
  renderDecisions();
  document.getElementById("idxMark").innerHTML = wm(19);
}
function renderDecisions() { document.getElementById("decBody").innerHTML = decisioni(); }

function setState(id, st) {
  S[id] = st;
  if (id === "chiave" && st === "applica") { run = 0; step(); }
  renderScreen(id);
}
let runTimer = null;
function step() {
  clearTimeout(runTimer);
  runTimer = setTimeout(() => {
    if (S.chiave !== "applica") return;
    run += 1; renderScreen("chiave");
    if (run < 4) step();
    else runTimer = setTimeout(() => { if (S.chiave === "applica") setState("chiave", "cancella"); }, 1100);
  }, 900);
}

document.addEventListener("click", (e) => {
  const seg = e.target.closest("[data-screen]");
  if (seg) return setState(seg.dataset.screen, seg.dataset.state);
  const go = e.target.closest("[data-go]");
  if (go) { const [id, st] = go.dataset.go.split(":"); return setState(id, st); }
  const jump = e.target.closest("[data-jump]");
  if (jump) { document.getElementById(`s-${jump.dataset.jump}`).scrollIntoView(); return; }
});
setInterval(() => document.querySelectorAll("[data-timer]").forEach((t) => (t.textContent = fmt(Date.now() - T0))), 1000);

// Index highlight
const obs = new IntersectionObserver((en) => en.forEach((x) => { if (x.isIntersecting) document.querySelectorAll(".index a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + x.target.id)); }), { rootMargin: "-30% 0px -60% 0px" });

// Concept chrome
const root = document.documentElement, body = document.body;
const KEY = `concept:${location.pathname}`;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
const setTheme = (t) => { root.dataset.theme = t; save({ ...load(), theme: t }); };
document.querySelector("[data-theme-toggle]").addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
  const k = e.key.toLowerCase();
  if (k === "t") setTheme(root.dataset.theme === "dark" ? "light" : "dark");
  else if (k === "p") body.dataset.chrome = body.dataset.chrome === "off" ? "on" : "off";
});
root.dataset.theme = load().theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
build();
document.querySelectorAll(".scr").forEach((s) => obs.observe(s));
</script>
