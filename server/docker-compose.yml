# The control plane for local development and the tests (production: deploy/): PostgreSQL 18, a pool of Valkey
# instances (one per disk, DECISIONS #23) and the server. Secrets come from server/.env
# (outside git); see .env.example.
#
#   docker compose up -d --build                        # migrations and bootstrap, then serve
#   docker compose up -d db meta-1 meta-2 meta-3        # only the stores, for `uv run`
#   docker compose --profile test up -d --build db meta-test-1 meta-test-2 meta-test-3 meta-test   # for the tests
#   docker compose --profile meta up -d --build meta    # the meta service, to try it
#   docker compose --profile s3 up -d garage && docker/garage-setup.sh   # a local S3 for tests
#
# The image carries the patched JuiceFS built by spike/juicefs-replica/build.sh; JUICEFS_DIST
# points at its output when it is not in the default place.
#
# Ports from the project's Portsage ranges (fluix 4500-4509, fluix-server 4540-4549,
# fluix-meta 4560-4569), on localhost only.
name: floppy-server

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: floppy_owner
      POSTGRES_PASSWORD: ${FLOPPY_DB_OWNER_PASSWORD:?set it in server/.env}
      POSTGRES_DB: floppy
      FLOPPY_DB_APP_PASSWORD: ${FLOPPY_DB_APP_PASSWORD:?set it in server/.env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - "127.0.0.1:4504:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floppy_owner -d floppy"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The meta service's pool for development and the tests (DECISIONS #25 is the real one):
  # each instance is handed to one disk. Every write is on disk before the answer
  # (architecture.html, Failure modes); ACL users are not persisted here: the control plane's
  # reconciler recreates them. No databases beyond 0 (the pool's claim) and 1 (the disk).
  meta-1: &meta
    image: valkey/valkey:8.1.4
    command: >
      valkey-server --requirepass ${FLOPPY_VALKEY_ADMIN_PASSWORD:?set it in server/.env}
      --appendonly yes --appendfsync always --databases 2 --repl-diskless-sync-delay 0
    volumes:
      - meta-1-data:/data
    ports:
      - "127.0.0.1:4541:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      VALKEY_PASSWORD: ${FLOPPY_VALKEY_ADMIN_PASSWORD}

  meta-2:
    <<: *meta
    volumes:
      - meta-2-data:/data
    ports:
      - "127.0.0.1:4542:6379"

  meta-3:
    <<: *meta
    volumes:
      - meta-3-data:/data
    ports:
      - "127.0.0.1:4543:6379"

  # The tests' own pool: their fixtures wipe it, so the development disks on meta-1..3 stay.
  meta-test-1:
    <<: *meta
    profiles: [test]
    volumes: []
    ports:
      - "127.0.0.1:4546:6379"

  meta-test-2:
    <<: *meta
    profiles: [test]
    volumes: []
    ports:
      - "127.0.0.1:4547:6379"

  meta-test-3:
    <<: *meta
    profiles: [test]
    volumes: []
    ports:
      - "127.0.0.1:4548:6379"

  # The meta service itself (meta/, DECISIONS #25): one valkey-server per disk inside the
  # container, created on the control plane's request. `meta` is for trying it in development
  # (profile meta; the server above still uses the pool), `meta-test` for the tests, with a
  # fixed token and no volume. Instance ports equal the host ports, so the control plane on
  # the host reaches an instance at the port the service reports.
  meta: &meta-service
    build: ../meta
    profiles: [meta]
    init: true
    stop_grace_period: 60s
    environment:
      FLOPPY_META_TOKEN: ${FLOPPY_META_TOKEN:-}
      FLOPPY_META_ROUTES_TOKEN: ${FLOPPY_META_ROUTES_TOKEN:-}
      FLOPPY_META_DOMAIN: meta.floppy.test
      FLOPPY_META_PORT_MIN: "4561"
      FLOPPY_META_PORT_MAX: "4564"
    volumes:
      - meta-data:/data
    ports:
      - "127.0.0.1:4560:8080"
      - "127.0.0.1:4561-4564:4561-4564"

  meta-test:
    <<: *meta-service
    profiles: [test]
    environment:
      FLOPPY_META_TOKEN: floppy-meta-test-token-not-a-secret-0001
      FLOPPY_META_ROUTES_TOKEN: floppy-meta-test-routes-not-a-secret-01
      FLOPPY_META_DOMAIN: meta.floppy.test
      FLOPPY_META_PORT_MIN: "4566"
      FLOPPY_META_PORT_MAX: "4569"
      FLOPPY_META_ACL_SAVE_SECONDS: "1"
    volumes: []
    ports:
      - "127.0.0.1:4565:8080"
      - "127.0.0.1:4566-4569:4566-4569"

  server:
    build:
      context: .
      additional_contexts:
        juicefs: ${JUICEFS_DIST:-../spike/juicefs-replica/dist}
    depends_on:
      db:
        condition: service_healthy
      meta-1:
        condition: service_healthy
      meta-2:
        condition: service_healthy
      meta-3:
        condition: service_healthy
    env_file: .env
    environment:
      FLOPPY_DATABASE_URL: postgresql+asyncpg://floppy_app:${FLOPPY_DB_APP_PASSWORD}@db:5432/floppy
      FLOPPY_MIGRATION_DATABASE_URL: postgresql+asyncpg://floppy_owner:${FLOPPY_DB_OWNER_PASSWORD}@db:5432/floppy
      # Devices reach the pool on the host's ports, the control plane on the Compose network.
      FLOPPY_META_POOL: redis://localhost:4541|redis://meta-1:6379,redis://localhost:4542|redis://meta-2:6379,redis://localhost:4543|redis://meta-3:6379
    ports:
      - "127.0.0.1:4507:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A local S3 for development and the integration tests, not for production.
  garage:
    image: dxflrs/garage:v2.1.0
    profiles: [s3]
    environment:
      GARAGE_RPC_SECRET: ${FLOPPY_GARAGE_RPC_SECRET:?run docker/garage-setup.sh}
      GARAGE_ADMIN_TOKEN: ${FLOPPY_GARAGE_ADMIN_TOKEN:?run docker/garage-setup.sh}
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:4509:3900"
      - "127.0.0.1:4540:3903" # admin API, for the managed storage adapter (fluix-server range)

volumes:
  db-data:
  meta-1-data:
  meta-2-data:
  meta-3-data:
  meta-data:
  garage-meta:
  garage-data:

# Explicit subnet: Docker's default address pools run out on a machine with many compose
# projects (CLAUDE.md, gotchas). The spike uses 10.250.45.0/24, spike/juicefs-replica/test.sh
# 10.250.46.0/24.
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.48.0/24
