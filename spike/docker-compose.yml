# Local S3 for the spike: Garage, plus Toxiproxy in front of it to simulate
# the latency and bandwidth of a real link to OVH. PostgreSQL stands in for the
# shared metadata database, also behind Toxiproxy (meta-bench.sh, meta-access.sh).
# The "replica" profile adds the architecture under test: a central Valkey behind
# the simulated link, and two clients (drive, drive-b) each with a local Valkey
# replica in its own network namespace, as it will run inside each Mac's VM.
services:
  garage:
    image: dxflrs/garage:v2.1.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run setup.sh first}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:4500:3900" # S3, direct (no simulated network)

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: floppy_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
      POSTGRES_DB: floppy
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "floppy_admin"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.4
    profiles: [replica]
    # Durable like production: every write on disk before the answer
    command: >-
      valkey-server --requirepass ${VALKEY_PASSWORD:-} --appendonly yes
      --appendfsync always --repl-backlog-size 256mb
    volumes:
      - valkey-data:/data

  valkey-a:
    image: valkey/valkey:8.1.4
    profiles: [replica]
    network_mode: "service:drive"
    # Replicates as the Mac's own user, so revoking the Mac also cuts its replica
    command: >-
      valkey-server --port 6380 --replicaof toxiproxy 4505
      --masteruser ${VALKEY_MASTERUSER_A:-default} --masterauth ${VALKEY_PASSWORD:-}a
      --requirepass ${VALKEY_PASSWORD:-} --replica-read-only yes --save "" --appendonly no

  valkey-b:
    image: valkey/valkey:8.1.4
    profiles: [replica]
    network_mode: "service:drive-b"
    command: >-
      valkey-server --port 6380 --replicaof toxiproxy 4505
      --masteruser ${VALKEY_MASTERUSER_B:-default} --masterauth ${VALKEY_PASSWORD:-}b
      --requirepass ${VALKEY_PASSWORD:-} --replica-read-only yes --save "" --appendonly no

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "127.0.0.1:4501:4501" # S3 through the simulated link
      - "127.0.0.1:4502:8474" # Toxiproxy API

  # The "shaped" profile turns the simulated link into one real bottleneck: a
  # token bucket on everything Toxiproxy sends, so all of JuiceFS's downloads
  # share one queue like on a real line. JuiceFS's own --download-limit lets
  # the first megabyte through at once and then stalls, which hides how
  # readahead competes with a new read. Use it with DOWNLOAD_LIMIT_MBPS=0.
  shaper:
    image: alpine:3.22
    profiles: [shaped]
    network_mode: "service:toxiproxy"
    cap_add: [NET_ADMIN]
    command: >-
      sh -c "apk add --no-cache iproute2-tc >/dev/null &&
      tc qdisc replace dev eth0 root tbf rate ${LINE_MBPS:-100}mbit burst 64kb latency 100ms &&
      tc qdisc show dev eth0 && exec sleep infinity"

  drive:
    build:
      context: ./drive
      args:
        JUICEFS_SOURCE: ${JUICEFS_SOURCE:-upstream}
      additional_contexts:
        replica: ./juicefs-replica/dist
    privileged: true # FUSE inside the container
    devices:
      - /dev/fuse
    environment:
      META_URL: ${META_URL:-sqlite3:///state/meta.db}
      VOLUME_NAME: ${VOLUME_NAME:-spike}
      # Production keeps 7 days: an open file deleted elsewhere keeps its blocks
      TRASH_DAYS: ${TRASH_DAYS:-0}
      SMB_DOS_ATTRIBUTES: ${SMB_DOS_ATTRIBUTES:-yes}
      BUCKET_URL: http://toxiproxy:4501/floppy
      # Extra flags for the first `juicefs format`, e.g. --block-size 1024
      FORMAT_OPTS: ${FORMAT_OPTS:-}
      # Read only by the first `juicefs format`, which stores them in the metadata
      ACCESS_KEY: ${ACCESS_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      # Extra mount flags, e.g. longer metadata caches: --attr-cache 10 --entry-cache 10
      MOUNT_OPTS: ${MOUNT_OPTS:-}
      SMB_PASSWORD: ${SMB_PASSWORD:?run setup.sh first}
      # Simulated link, in Mbps for the whole mount (0 = unlimited). Toxiproxy
      # only adds latency: its bandwidth limit is per connection, and JuiceFS
      # opens many in parallel.
      DOWNLOAD_LIMIT_MBPS: ${DOWNLOAD_LIMIT_MBPS:-100}
      UPLOAD_LIMIT_MBPS: ${UPLOAD_LIMIT_MBPS:-300}
      PREFETCH: ${PREFETCH:-8}
    volumes:
      - ${HOME}/.floppy-spike:/state
      - drive-cache:/cache
    ports:
      - "127.0.0.1:4503:445" # SMB, mount from Finder: smb://drive@localhost:4503/Floppy
    depends_on:
      - toxiproxy

  drive-b:
    profiles: [replica]
    build:
      context: ./drive
      args:
        JUICEFS_SOURCE: ${JUICEFS_SOURCE:-upstream}
      additional_contexts:
        replica: ./juicefs-replica/dist
    privileged: true # FUSE inside the container
    devices:
      - /dev/fuse
    environment:
      META_URL: ${META_URL_B:-sqlite3:///state/meta.db}
      VOLUME_NAME: ${VOLUME_NAME:-spike}
      # Production keeps 7 days: an open file deleted elsewhere keeps its blocks
      TRASH_DAYS: ${TRASH_DAYS:-0}
      SMB_DOS_ATTRIBUTES: ${SMB_DOS_ATTRIBUTES:-yes}
      BUCKET_URL: http://toxiproxy:4501/floppy
      # Extra flags for the first `juicefs format`, e.g. --block-size 1024
      FORMAT_OPTS: ${FORMAT_OPTS:-}
      # Read only by the first `juicefs format`, which stores them in the metadata
      ACCESS_KEY: ${ACCESS_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      # Extra mount flags, e.g. longer metadata caches: --attr-cache 10 --entry-cache 10
      MOUNT_OPTS: ${MOUNT_OPTS:-}
      SMB_PASSWORD: ${SMB_PASSWORD:?run setup.sh first}
      # Simulated link, in Mbps for the whole mount (0 = unlimited). Toxiproxy
      # only adds latency: its bandwidth limit is per connection, and JuiceFS
      # opens many in parallel.
      DOWNLOAD_LIMIT_MBPS: ${DOWNLOAD_LIMIT_MBPS:-100}
      UPLOAD_LIMIT_MBPS: ${UPLOAD_LIMIT_MBPS:-300}
      PREFETCH: ${PREFETCH:-8}
    volumes:
      - ${HOME}/.floppy-spike-b:/state
      - drive-b-cache:/cache
    ports:
      - "127.0.0.1:4506:445" # SMB of the second client
    depends_on:
      - toxiproxy

  # The "perdisk" profile: one Valkey instance per disk, each behind the simulated
  # link (Toxiproxy 4511-4513), and one client (drive-p) holding a local replica
  # only of the disks its person may see (valkey-p1..3, on 6381-6383 in its
  # network namespace). Each disk is its own JuiceFS mount at /mnt/drive/<disk>,
  # mounted by spike/perdisk.py, which also sets the users and starts the replicas.
  # A full sync waits repl-diskless-sync-delay (5 s by default) for more replicas
  # to share it: SYNC_DELAY=0 starts it at once (t25).
  valkey-disk1: &disk-master
    image: valkey/valkey:8.1.4
    profiles: [perdisk]
    command: >-
      valkey-server --requirepass ${VALKEY_PASSWORD:-} --appendonly yes
      --appendfsync always --repl-backlog-size 256mb
      --repl-diskless-sync-delay ${SYNC_DELAY:-5}
  valkey-disk2: *disk-master
  valkey-disk3: *disk-master

  drive-p:
    profiles: [perdisk]
    build:
      context: ./drive
      args:
        JUICEFS_SOURCE: ${JUICEFS_SOURCE:-replica}
      additional_contexts:
        replica: ./juicefs-replica/dist
    privileged: true # FUSE inside the container
    devices:
      - /dev/fuse
    entrypoint: ["/perdisk-entrypoint.sh"]
    environment:
      SMB_PASSWORD: ${SMB_PASSWORD:?run setup.sh first}
      # How the share's root is kept read-only, and Samba's user (perdisk-entrypoint.sh)
      ROOT_MODE: ${ROOT_MODE:-chmod}
      SMB_FORCE_USER: ${SMB_FORCE_USER:-root}
    volumes:
      - ./drive/perdisk-entrypoint.sh:/perdisk-entrypoint.sh:ro
      - drive-p-cache:/cache
    ports:
      - "127.0.0.1:4510:445" # SMB of the per-disk client
    depends_on:
      - toxiproxy

  # One replica per visible disk, as the device's own Valkey user on that disk's
  # instance: a device without a user there cannot replicate it.
  valkey-p1: &disk-replica
    image: valkey/valkey:8.1.4
    profiles: [perdisk]
    network_mode: "service:drive-p"
    command: >-
      valkey-server --port 6381 --replicaof toxiproxy 4511
      --masteruser ${PERDISK_USER:-default} --masterauth ${PERDISK_PASSWORD:-}
      --requirepass ${VALKEY_PASSWORD:-} --replica-read-only yes --save "" --appendonly no
  valkey-p2:
    <<: *disk-replica
    command: >-
      valkey-server --port 6382 --replicaof toxiproxy 4512
      --masteruser ${PERDISK_USER:-default} --masterauth ${PERDISK_PASSWORD:-}
      --requirepass ${VALKEY_PASSWORD:-} --replica-read-only yes --save "" --appendonly no
  valkey-p3:
    <<: *disk-replica
    command: >-
      valkey-server --port 6383 --replicaof toxiproxy 4513
      --masteruser ${PERDISK_USER:-default} --masterauth ${PERDISK_PASSWORD:-}
      --requirepass ${VALKEY_PASSWORD:-} --replica-read-only yes --save "" --appendonly no

volumes:
  drive-cache:
  drive-b-cache:
  drive-p-cache:
  valkey-data:
  garage-meta:
  garage-data:
  pg-data:

# Explicit subnet: Docker's default address pools can be exhausted on a
# machine with many compose projects.
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.45.0/24
