# deploy/check's Traefik: Dokploy's default static configuration (getDefaultTraefikConfig in
# Dokploy's traefik-setup.ts: Docker and file providers, web and websecure with HTTP/3, the
# letsencrypt resolver) plus the blocks of deploy/traefik/traefik.yml. Locally the
# certificates are a self-signed wildcard in the file provider's TLS store (check.py writes
# them), so neither resolver is ever asked for one.
providers:
  docker:
    exposedByDefault: false
    watch: true
    network: floppy-check-proxy
    # Only this project's containers, on a machine running many.
    constraints: "Label(`com.docker.compose.project`, `floppy-deploy-check`)"
  file:
    directory: /etc/traefik/dynamic
    watch: true
  http:
    endpoint: http://floppy-meta:8080/v1/traefik
    pollInterval: 5s
    headers:
      Authorization: Bearer floppy-check-routes-token-not-a-secret-0001

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    http3:
      advertisedPort: 443
    http:
      tls:
        certResolver: letsencrypt
    transport:
      respondingTimeouts:
        readTimeout: 0

certificatesResolvers:
  letsencrypt:
    acme:
      email: check@floppy.test
      storage: /tmp/acme.json
      # Never reached: the check's routers find the store's certificate first.
      caServer: https://127.0.0.1:9/directory
      httpChallenge:
        entryPoint: web

log:
  level: INFO
