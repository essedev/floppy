[project]
name = "floppy-meta"
version = "0.1.0"
description = "Floppy meta service: one Valkey instance per disk, run on the control plane's request"
license = "AGPL-3.0-only"
authors = [
    { name = "Simone Salerno", email = "doppiaesse@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
floppy-meta = "floppy_meta:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "RUF", "ASYNC", "PT", "RET", "TID", "PL"]
ignore = [
    "PLR0913",  # constructors take what they take
    "PLR2004",  # magic values in comparisons read fine here
    "E501",     # the formatter wraps code; long strings stay readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "PLR2004", "PT018"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# redis-py's execute_command is untyped; ACL and CONFIG have no typed wrappers.
module = ["floppy_meta.supervisor", "tests.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
